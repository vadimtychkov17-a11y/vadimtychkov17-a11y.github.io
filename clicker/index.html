<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>vindim — Clicker ULTRA</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body, html {
    width: 100%; height: 100%;
    background: #050510;
    overflow: hidden;
    font-family: 'Inter', -apple-system, sans-serif;
    color: #fff;
    user-select: none;
    touch-action: none;
  }

  /* ===== ЗАСТАВКА VINDIM ===== */
  #splash {
    position: fixed; inset: 0; z-index: 9999; background: #050510;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 1s ease;
  }
  #splash.hidden { opacity: 0; pointer-events: none; }
  .splash-logo {
    font-family: 'Segoe Script', 'Brush Script MT', cursive;
    font-size: clamp(60px, 15vw, 150px);
    color: #e8d5ff;
    text-shadow: 0 0 30px rgba(180, 100, 255, 0.8), 0 0 80px rgba(140, 60, 220, 0.6);
    animation: logoAnim 3s ease forwards;
  }
  @keyframes logoAnim {
    0% { opacity: 0; transform: scale(0.9); filter: blur(10px); }
    20% { opacity: 1; transform: scale(1); filter: blur(0); }
    80% { opacity: 1; }
    100% { opacity: 0; transform: scale(1.05); }
  }

  /* ===== ФОН ===== */
  .bg-glow {
    position: absolute; inset: 0; z-index: 0; pointer-events: none;
    background: 
      radial-gradient(circle at 20% 30%, rgba(0, 150, 255, 0.15) 0%, transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(180, 0, 255, 0.15) 0%, transparent 50%);
    filter: blur(40px);
  }

  /* ===== ИНТЕРФЕЙС ===== */
  .game-container {
    position: relative; z-index: 1;
    width: 100%; height: 100%;
    display: grid;
    grid-template-columns: 350px 1fr 350px;
    gap: 20px;
    padding: 20px;
    max-width: 1600px;
    margin: 0 auto;
  }

  /* 10% изменения стиля: Усиленный Glassmorphism (добавили капельку неона) */
  .glass-panel {
    background: rgba(20, 20, 30, 0.6);
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 28px;
    box-shadow: 
      0 20px 50px rgba(0, 0, 0, 0.6),
      inset 0 1px 0 rgba(255, 255, 255, 0.15),
      0 0 20px rgba(0, 255, 255, 0.05); /* Легкий неоновый отблеск */
    display: flex;
    flex-direction: column;
    padding: 20px;
    overflow: hidden;
  }

  /* --- ЦЕНТР --- */
  .center-panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* 10% изменения: Градиентный текст очков */
  .score-display {
    text-align: center;
    margin-bottom: 20px;
    position: relative;
  }
  .score-value {
    font-size: clamp(50px, 7vw, 90px);
    font-weight: 900;
    line-height: 1;
    letter-spacing: -2px;
    background: linear-gradient(135deg, #00ffff, #aa00ff, #00ff88);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 20px rgba(0, 255, 255, 0.3));
  }
  .score-label { font-size: 14px; text-transform: uppercase; color: rgba(255,255,255,0.6); letter-spacing: 2px; margin-top: 5px; }
  .income-display { font-size: 20px; color: #00ff88; margin-top: 10px; font-weight: 700; text-shadow: 0 0 10px rgba(0,255,136,0.5); }

  /* Главная кнопка (Эволюционирует) */
  .btn-wrapper {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 280px; height: 280px;
  }

  /* 10% изменения: Вращающееся неоновое кольцо вокруг кнопки */
  .btn-ring {
    position: absolute;
    inset: -10px;
    border-radius: 50%;
    border: 2px dashed rgba(0, 255, 255, 0.3);
    animation: spinRing 20s linear infinite;
  }
  @keyframes spinRing { 100% { transform: rotate(360deg); } }

  .main-btn {
    width: 240px; height: 240px;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(0, 255, 255, 0.2), rgba(124, 58, 237, 0.2));
    border: 2px solid rgba(0, 255, 255, 0.5);
    box-shadow: 
      0 0 40px rgba(0, 255, 255, 0.3),
      inset 0 0 40px rgba(0, 255, 255, 0.2);
    cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: transform 0.05s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.1s, border-color 0.5s;
    position: relative;
    z-index: 2;
  }
  .main-btn:active { transform: scale(0.9); box-shadow: 0 0 100px rgba(0, 255, 255, 0.8), inset 0 0 60px rgba(0, 255, 255, 0.6); }
  .main-btn svg { width: 90px; height: 90px; fill: #fff; filter: drop-shadow(0 0 15px rgba(255,255,255,0.5)); }
  
  /* Комбо индикатор */
  #comboText {
    position: absolute; top: -30px; left: 50%; transform: translateX(-50%);
    font-size: 24px; font-weight: 900; color: #ffaa00;
    text-shadow: 0 0 20px #ffaa00;
    opacity: 0; transition: opacity 0.2s;
  }
  #comboText.active { opacity: 1; animation: popCombo 0.3s ease; }
  @keyframes popCombo { 0% { transform: translateX(-50%) scale(0.5); } 100% { transform: translateX(-50%) scale(1); } }

  /* Летящие цифры */
  .floating-text {
    position: absolute;
    font-size: 32px; font-weight: 900;
    color: #00ffff;
    text-shadow: 0 0 15px rgba(0,255,255,0.8);
    pointer-events: none;
    animation: floatUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    z-index: 100;
  }
  @keyframes floatUp {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-120px) scale(1.5); }
  }

  /* Визуальные помощники (Сферы) */
  .pet {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle, #fff, transparent);
    box-shadow: 0 0 10px #00ffff;
    pointer-events: none;
    z-index: 1;
    animation: orbit 4s linear infinite;
  }
  @keyframes orbit {
    0% { transform: rotate(0deg) translateX(140px) rotate(0deg); }
    100% { transform: rotate(360deg) translateX(140px) rotate(-360deg); }
  }

  /* --- МАГАЗИН --- */
  .panel-title {
    font-size: 20px; font-weight: 700;
    margin-bottom: 15px; padding-bottom: 10px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    display: flex; justify-content: space-between; align-items: center;
  }
  .shop-list {
    flex: 1; overflow-y: auto; padding-right: 10px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .shop-list::-webkit-scrollbar { width: 6px; }
  .shop-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }

  .shop-item {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 12px 16px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex; align-items: center; gap: 15px;
  }
  .shop-item:hover { background: rgba(255,255,255,0.1); transform: translateX(5px); border-color: rgba(0,255,255,0.3); }
  .shop-item.disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  
  .shop-icon { font-size: 28px; filter: drop-shadow(0 0 5px rgba(255,255,255,0.3)); }
  .shop-info { flex: 1; }
  .shop-name { font-size: 15px; font-weight: 600; }
  .shop-cost { font-size: 13px; color: #ffdd00; margin-top: 2px; }
  .shop-count { font-size: 20px; font-weight: 900; color: rgba(255,255,255,0.2); }

  /* --- ПРАВАЯ ПАНЕЛЬ --- */
  .prestige-btn {
    width: 100%; padding: 15px;
    background: linear-gradient(135deg, #ff00aa, #5500ff);
    border: none; border-radius: 16px;
    color: #fff; font-size: 16px; font-weight: bold;
    cursor: pointer; margin-bottom: 15px;
    box-shadow: 0 0 20px rgba(255, 0, 170, 0.4);
    transition: all 0.3s;
    display: none;
  }
  .prestige-btn:hover { box-shadow: 0 0 40px rgba(255, 0, 170, 0.8); transform: scale(1.02); }
  .prestige-btn.show { display: block; }

  .achievements-list {
    flex: 1; overflow-y: auto; padding-right: 10px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .achievement {
    background: rgba(0,0,0,0.2);
    border-left: 3px solid #555;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 13px; color: rgba(255,255,255,0.5);
    transition: all 0.3s;
  }
  .achievement.unlocked {
    border-left-color: #00ff88; color: #fff;
    background: rgba(0, 255, 136, 0.1);
    box-shadow: inset 0 0 10px rgba(0, 255, 136, 0.1);
  }

  /* ===== УВЕДОМЛЕНИЯ (Toast) ===== */
  #toast-container {
    position: fixed; top: 20px; right: 20px;
    display: flex; flex-direction: column; gap: 10px;
    z-index: 10000; pointer-events: none;
  }
  .toast {
    background: rgba(20, 20, 30, 0.9);
    backdrop-filter: blur(15px);
    border: 1px solid rgba(0, 255, 255, 0.3);
    border-left: 4px solid #00ffff;
    padding: 15px 20px; border-radius: 12px;
    color: #fff; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    animation: slideInRight 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    max-width: 300px;
  }
  @keyframes slideInRight {
    from { opacity: 0; transform: translateX(100%); }
    to { opacity: 1; transform: translateX(0); }
  }
  .toast.fade-out { animation: fadeOut 0.5s forwards; }
  @keyframes fadeOut { to { opacity: 0; transform: translateY(-20px); } }

  /* Золотая кнопка */
  #goldenCookie {
    position: absolute; width: 60px; height: 60px;
    background: radial-gradient(circle, #ffdd00, #ff8800);
    border-radius: 50%; box-shadow: 0 0 30px #ffdd00, 0 0 60px #ffaa00;
    display: none; cursor: pointer; z-index: 999;
    animation: pulseCookie 0.8s infinite alternate, spinCookie 10s linear infinite;
  }
  #goldenCookie.show { display: block; }
  @keyframes pulseCookie { 0% { transform: scale(1); } 100% { transform: scale(1.2); } }
  @keyframes spinCookie { 100% { transform: rotate(360deg); } }

  #buffIndicator {
    position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
    background: rgba(255, 200, 0, 0.2); border: 1px solid #ffdd00;
    padding: 8px 20px; border-radius: 20px; color: #ffdd00; font-weight: bold;
    display: none; z-index: 100; animation: flashBuff 0.5s infinite alternate;
  }
  @keyframes flashBuff { 0% { opacity: 0.7; } 100% { opacity: 1; } }

  @media (max-width: 1000px) {
    .game-container { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; overflow-y: auto; }
    .glass-panel { min-height: 250px; }
  }
</style>
</head>
<body>

<!-- ЗАСТАВКА -->
<div id="splash">
  <div class="splash-logo">vindim</div>
</div>

<!-- УВЕДОМЛЕНИЯ -->
<div id="toast-container"></div>

<div class="bg-glow"></div>
<div id="buffIndicator">🔥 x7 ДОХОД! 🔥</div>
<div id="goldenCookie"></div>

<div class="game-container">
  
  <!-- ЛЕВАЯ ПАНЕЛЬ: МАГАЗИН -->
  <div class="glass-panel">
    <div class="panel-title">
      Магазин
      <span style="font-size: 12px; color: rgba(255,255,255,0.4);">Улучшения</span>
    </div>
    <div class="shop-list" id="shopList"></div>
  </div>

  <!-- ЦЕНТР: КЛИКЕР -->
  <div class="glass-panel center-panel">
    
    <div class="score-display">
      <div class="score-value" id="scoreValue">0</div>
      <div class="score-label">Очков</div>
      <div class="income-display" id="incomeValue">0/сек</div>
    </div>

    <div class="btn-wrapper">
      <div id="comboText">x1</div>
      <div class="btn-ring"></div>
      <button class="main-btn" id="mainButton">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm0-14c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6zm0 10c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79 4-4 4z"/></svg>
      </button>
    </div>
  </div>

  <!-- ПРАВАЯ ПАНЕЛЬ: ПРЕСТИЖ И ДОСТИЖЕНИЯ -->
  <div class="glass-panel">
    <div class="panel-title">Прогресс</div>
    <button class="prestige-btn" id="prestigeBtn">ПЕРЕРОЖДЕНИЕ (+0)</button>
    <div class="achievements-list" id="achievementsList"></div>
  </div>

</div>

<script>
/* ==========================================
   1. АУДИО СИСТЕМА (Синтез)
   ========================================== */
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playClickSound(combo = 1) {
  initAudio();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  // Чем выше комбо, тем выше тон
  osc.type = 'sine';
  const baseFreq = 600 + (combo * 50);
  osc.frequency.setValueAtTime(baseFreq + Math.random() * 100, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(baseFreq * 0.5, audioCtx.currentTime + 0.1);
  gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + 0.1);
}

function playBuySound() {
  initAudio();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(400, audioCtx.currentTime);
  osc.frequency.linearRampToValueAtTime(800, audioCtx.currentTime + 0.1);
  gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + 0.2);
}

/* ==========================================
   2. ИГРОВЫЕ ДАННЫЕ (Расширено)
   ========================================== */
let score = 0;
let totalScore = 0;
let clickPower = 1;
let autoPower = 0;
let prestigeMultiplier = 1;
let prestigePoints = 0;

// Комбо-система
let comboCount = 0;
let comboTimer = 0;
let currentCombo = 1;
let lastClickTime = 0;

// Буфф
let buffMultiplier = 1;
let buffTimer = 0;

// Апгрейды (больше контента)
const upgrades = [
  { id: 'cursor', name: 'Курсор', icon: '👆', baseCost: 10, costMult: 1.15, type: 'click', value: 1, count: 0 },
  { id: 'robot', name: 'Робот-Кликер', icon: '🤖', baseCost: 100, costMult: 1.15, type: 'auto', value: 1, count: 0 },
  { id: 'factory', name: 'Фабрика', icon: '🏭', baseCost: 1000, costMult: 1.15, type: 'auto', value: 5, count: 0 },
  { id: 'mine', name: 'Шахта', icon: '⛏️', baseCost: 5000, costMult: 1.15, type: 'auto', value: 20, count: 0 },
  { id: 'bank', name: 'Банк', icon: '🏦', baseCost: 50000, costMult: 1.15, type: 'auto', value: 100, count: 0 },
  { id: 'temple', name: 'Храм', icon: '🏛️', baseCost: 500000, costMult: 1.15, type: 'auto', value: 500, count: 0 },
  { id: 'space', name: 'Космостанция', icon: '🚀', baseCost: 1e6, costMult: 1.15, type: 'auto', value: 2000, count: 0 },
  { id: 'quantum', name: 'Квантовый ПК', icon: '⚛️', baseCost: 1e7, costMult: 1.15, type: 'auto', value: 10000, count: 0 },
  { id: 'dyson', name: 'Сфера Дайсона', icon: '☀️', baseCost: 1e8, costMult: 1.15, type: 'auto', value: 50000, count: 0 },
  { id: 'universe', name: 'Карманная Вселенная', icon: '🌌', baseCost: 1e9, costMult: 1.15, type: 'auto', value: 250000, count: 0 }
];

// Достижения
const achievementsList = [
  { id: 'first_click', name: 'Первый клик', desc: 'Сделай 1 клик', unlocked: false, check: () => totalScore >= 1 },
  { id: 'hundred', name: 'Сотня', desc: 'Накопи 100 очков', unlocked: false, check: () => totalScore >= 100 },
  { id: 'first_buy', name: 'Шопоголик', desc: 'Купи первое улучшение', unlocked: false, check: () => upgrades.some(u => u.count > 0) },
  { id: 'combo_10', name: 'Мастер клика', desc: 'Достигни комбо x10', unlocked: false, check: () => currentCombo >= 10 },
  { id: 'million', name: 'Миллионер', desc: 'Накопи 1,000,000 очков', unlocked: false, check: () => totalScore >= 1e6 },
  { id: 'billion', name: 'Миллиардер', desc: 'Накопи 1,000,000,000 очков', unlocked: false, check: () => totalScore >= 1e9 },
  { id: 'golden', name: 'Золотая лихорадка', desc: 'Поймай золотую кнопку', unlocked: false, check: () => hasCaughtGolden },
  { id: 'prestige', name: 'Новая жизнь', desc: 'Сделай перерождение', unlocked: false, check: () => prestigePoints > 0 }
];
let hasCaughtGolden = false;

/* ==========================================
   3. ФОРМАТИРОВАНИЕ
   ========================================== */
function formatNumber(num) {
  if (num < 1000) return Math.floor(num).toString();
  const suffixes = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc'];
  const tier = Math.floor(Math.log10(Math.abs(num)) / 3);
  if (tier === 0) return num.toString();
  const suffix = suffixes[tier];
  const scale = Math.pow(10, tier * 3);
  return (num / scale).toFixed(2) + suffix;
}

/* ==========================================
   4. УВЕДОМЛЕНИЯ (Вместо alert)
   ========================================== */
function showToast(text, color = '#00ffff') {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.style.borderLeftColor = color;
  toast.innerHTML = text;
  container.appendChild(toast);
  
  setTimeout(() => {
    toast.classList.add('fade-out');
    setTimeout(() => toast.remove(), 500);
  }, 3000);
}

/* ==========================================
   5. РЕНДЕР UI
   ========================================== */
const scoreEl = document.getElementById('scoreValue');
const incomeEl = document.getElementById('incomeValue');
const shopListEl = document.getElementById('shopList');
const achListEl = document.getElementById('achievementsList');
const prestigeBtn = document.getElementById('prestigeBtn');
const buffEl = document.getElementById('buffIndicator');
const comboEl = document.getElementById('comboText');
const mainBtn = document.getElementById('mainButton');

// Генерация визуальных помощников (сферы вокруг кнопки)
let petCount = 0;
function updatePets() {
  const autoCount = upgrades.reduce((acc, up) => acc + (up.type === 'auto' ? up.count : 0), 0);
  const targetPets = Math.min(Math.floor(autoCount / 5), 12); // Максимум 12 сфер
  
  if (targetPets > petCount) {
    for (let i = petCount; i < targetPets; i++) {
      const pet = document.createElement('div');
      pet.className = 'pet';
      pet.style.width = pet.style.height = `${Math.random() * 10 + 5}px`;
      pet.style.animationDuration = `${3 + Math.random() * 4}s`;
      pet.style.animationDelay = `-${Math.random() * 5}s`;
      // Случайный цвет
      pet.style.boxShadow = `0 0 10px hsl(${Math.random() * 360}, 100%, 50%)`;
      document.querySelector('.btn-wrapper').appendChild(pet);
    }
    petCount = targetPets;
  }
}

// Эволюция кнопки (меняет цвет при достижении порогов)
function updateButtonStyle() {
  if (totalScore > 1e9) {
    mainBtn.style.borderColor = 'rgba(255, 0, 170, 0.8)';
    mainBtn.style.boxShadow = '0 0 60px rgba(255, 0, 170, 0.5), inset 0 0 40px rgba(255, 0, 170, 0.3)';
  } else if (totalScore > 1e6) {
    mainBtn.style.borderColor = 'rgba(255, 170, 0, 0.8)';
    mainBtn.style.boxShadow = '0 0 60px rgba(255, 170, 0, 0.5), inset 0 0 40px rgba(255, 170, 0, 0.3)';
  } else if (totalScore > 1000) {
    mainBtn.style.borderColor = 'rgba(0, 255, 136, 0.8)';
    mainBtn.style.boxShadow = '0 0 60px rgba(0, 255, 136, 0.5), inset 0 0 40px rgba(0, 255, 136, 0.3)';
  }
}

function updateUI() {
  scoreEl.textContent = formatNumber(score);
  
  let currentAuto = autoPower * prestigeMultiplier;
  if (buffTimer > 0) currentAuto *= buffMultiplier;
  incomeEl.textContent = formatNumber(currentAuto) + '/сек';
  
  // Магазин
  shopListEl.innerHTML = '';
  upgrades.forEach((up, index) => {
    const currentCost = Math.floor(up.baseCost * Math.pow(up.costMult, up.count));
    const canAfford = score >= currentCost;
    
    const div = document.createElement('div');
    div.className = `shop-item ${canAfford ? '' : 'disabled'}`;
    div.innerHTML = `
      <div class="shop-icon">${up.icon}</div>
      <div class="shop-info">
        <div class="shop-name">${up.name}</div>
        <div class="shop-cost">${formatNumber(currentCost)}</div>
      </div>
      <div class="shop-count">${up.count}</div>
    `;
    if (canAfford) div.onclick = () => buyUpgrade(index);
    shopListEl.appendChild(div);
  });

  // Достижения
  achListEl.innerHTML = '';
  achievementsList.forEach(ach => {
    if (!ach.unlocked && ach.check()) {
      ach.unlocked = true;
      playBuySound();
      showToast(`🏆 Достижение: <b>${ach.name}</b>`, '#00ff88');
    }
    const div = document.createElement('div');
    div.className = `achievement ${ach.unlocked ? 'unlocked' : ''}`;
    div.innerHTML = `<b>${ach.name}</b><br>${ach.desc}`;
    achListEl.appendChild(div);
  });

  // Престиж
  const possiblePoints = Math.floor(Math.sqrt(totalScore / 1000000));
  if (possiblePoints > prestigePoints) {
    prestigeBtn.classList.add('show');
    prestigeBtn.textContent = `ПЕРЕРОЖДЕНИЕ (+${possiblePoints - prestigePoints}%)`;
  } else {
    prestigeBtn.classList.remove('show');
  }

  // Буфф
  if (buffTimer > 0) {
    buffEl.style.display = 'block';
    buffEl.textContent = `🔥 x${buffMultiplier} ДОХОД! (${Math.ceil(buffTimer)}с) 🔥`;
  } else {
    buffEl.style.display = 'none';
  }

  updatePets();
  updateButtonStyle();
}

/* ==========================================
   6. ЛОГИКА КЛИКА (С КОМБО)
   ========================================== */
function clickMainButton(e) {
  const now = performance.now();
  
  // Логика комбо (если клик быстрее 300мс)
  if (now - lastClickTime < 300) {
    comboCount++;
    if (comboCount > 5) currentCombo = Math.min(1 + Math.floor(comboCount / 5), 10); // Максимум x10
  } else {
    comboCount = 1;
    currentCombo = 1;
  }
  lastClickTime = now;

  // Показываем комбо
  if (currentCombo > 1) {
    comboEl.textContent = `x${currentCombo}`;
    comboEl.classList.add('active');
    clearTimeout(comboTimer);
    comboTimer = setTimeout(() => {
      comboEl.classList.remove('active');
      currentCombo = 1;
      comboCount = 0;
    }, 1000); // Сброс комбо через секунду
  }

  // Начисление
  const buffMult = buffTimer > 0 ? buffMultiplier : 1;
  let earned = clickPower * prestigeMultiplier * currentCombo * buffMult;
  
  score += earned;
  totalScore += earned;
  
  playClickSound(currentCombo);
  
  // Спавн летящей цифры (искры при высоком комбо)
  const rect = e.currentTarget.getBoundingClientRect();
  const floatEl = document.createElement('div');
  floatEl.className = 'floating-text';
  floatEl.textContent = `+${formatNumber(earned)}`;
  floatEl.style.left = `${e.clientX}px`;
  floatEl.style.top = `${e.clientY}px`;
  if (currentCombo > 5) floatEl.style.color = '#ffaa00'; // Оранжевый при комбо
  document.body.appendChild(floatEl);
  
  setTimeout(() => floatEl.remove(), 800);
  
  updateUI();
}

function buyUpgrade(index) {
  const up = upgrades[index];
  const cost = Math.floor(up.baseCost * Math.pow(up.costMult, up.count));
  
  if (score >= cost) {
    score -= cost;
    up.count++;
    
    if (up.type === 'click') clickPower += up.value;
    if (up.type === 'auto') autoPower += up.value;
    
    playBuySound();
    updateUI();
  }
}

// Игровой тик
setInterval(() => {
  if (buffTimer > 0) buffTimer--;
  
  let buffMult = buffTimer > 0 ? buffMultiplier : 1;
  let earned = autoPower * prestigeMultiplier * buffMult;
  
  score += earned;
  totalScore += earned;
  
  updateUI();
}, 1000);

/* ==========================================
   7. ЗОЛОТАЯ КНОПКА
   ========================================== */
const goldenBtn = document.getElementById('goldenCookie');

function spawnGoldenCookie() {
  if (buffTimer > 0) return;
  
  const x = Math.random() * (window.innerWidth - 100);
  const y = Math.random() * (window.innerHeight - 100);
  
  goldenBtn.style.left = `${x}px`;
  goldenBtn.style.top = `${y}px`;
  goldenBtn.classList.add('show');
  
  const timeout = setTimeout(() => {
    goldenBtn.classList.remove('show');
  }, 8000); // Исчезает через 8 сек
  
  goldenBtn.onclick = () => {
    clearTimeout(timeout);
    goldenBtn.classList.remove('show');
    
    buffMultiplier = 7;
    buffTimer = 15;
    hasCaughtGolden = true;
    
    playBuySound();
    showToast('🔥 <b>ЗОЛОТАЯ ЛИХОРАДКА!</b><br>Доход x7 на 15 секунд!', '#ffdd00');
    updateUI();
  };
}

setInterval(() => {
  if (Math.random() < 0.15) spawnGoldenCookie();
}, 10000);

/* ==========================================
   8. ПРЕСТИЖ
   ========================================== */
prestigeBtn.addEventListener('click', () => {
  const pointsToGain = Math.floor(Math.sqrt(totalScore / 1000000)) - prestigePoints;
  if (pointsToGain <= 0) return;
  
  if (confirm(`Переродиться и получить +${pointsToGain}% к доходу навсегда? (Все очки и апгрейды сбросятся)`)) {
    prestigePoints += pointsToGain;
    prestigeMultiplier = 1 + (prestigePoints * 0.01);
    
    score = 0;
    totalScore = 0;
    clickPower = 1;
    autoPower = 0;
    upgrades.forEach(u => u.count = 0);
    
    // Сброс визуальных сфер
    document.querySelectorAll('.pet').forEach(p => p.remove());
    petCount = 0;
    
    playBuySound();
    showToast('🌌 <b>ПЕРЕРОЖДЕНИЕ!</b><br>Твой постоянный множитель: x' + prestigeMultiplier.toFixed(2), '#aa00ff');
    updateUI();
  }
});

/* ==========================================
   9. СОХРАНЕНИЕ И ИНИЦИАЛИЗАЦИЯ
   ========================================== */
function saveGame() {
  localStorage.setItem('vindimClickerUltra', JSON.stringify({
    score, totalScore, clickPower, autoPower, prestigeMultiplier, prestigePoints,
    upgrades: upgrades.map(u => u.count),
    lastSave: Date.now()
  }));
}

function loadGame() {
  const saved = localStorage.getItem('vindimClickerUltra');
  if (saved) {
    const data = JSON.parse(saved);
    score = data.score || 0;
    totalScore = data.totalScore || 0;
    clickPower = data.clickPower || 1;
    autoPower = data.autoPower || 0;
    prestigeMultiplier = data.prestigeMultiplier || 1;
    prestigePoints = data.prestigePoints || 0;
    
    if (data.upgrades) upgrades.forEach((u, i) => u.count = data.upgrades[i] || 0);

    if (data.lastSave) {
      const offlineSecs = Math.min((Date.now() - data.lastSave) / 1000, 7200);
      const offlineEarned = autoPower * prestigeMultiplier * offlineSecs;
      score += offlineEarned;
      totalScore += offlineEarned;
      
      if (offlineEarned > 10) {
        setTimeout(() => {
          showToast(`💤 Пока тебя не было, ты заработал:<br><b style="font-size:18px;color:#00ffff;">+${formatNumber(offlineEarned)}</b>`, '#00d2ff');
        }, 1000);
      }
    }
  }
}

setInterval(saveGame, 10000);
window.addEventListener('beforeunload', saveGame);

document.getElementById('mainButton').addEventListener('click', clickMainButton);

setTimeout(() => {
  document.getElementById('splash').classList.add('hidden');
  loadGame();
  updateUI();
}, 3000);

</script>
</body>
