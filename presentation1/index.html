<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
 <link rel="icon" type="image/x-icon" href="/favicon.ico">
 <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
<meta name="theme-color" content="#0d0620">
<title>Презентация — Vindim</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: 'Segoe UI', sans-serif;
    background: #0d0620;
    color: #fff;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }

  /* ===== Звёздный фон ===== */
  .stars, .stars2, .stars3 {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }
  .stars {
    background:
      radial-gradient(2px 2px at 20px 30px, #fff, transparent),
      radial-gradient(2px 2px at 40px 70px, #fff, transparent),
      radial-gradient(1px 1px at 90px 40px, #fff, transparent),
      radial-gradient(1px 1px at 130px 80px, #fff, transparent),
      radial-gradient(2px 2px at 160px 120px, #fff, transparent),
      radial-gradient(1px 1px at 200px 50px, #fff, transparent),
      radial-gradient(1px 1px at 250px 150px, #fff, transparent),
      radial-gradient(2px 2px at 300px 90px, #fff, transparent);
    background-repeat: repeat;
    background-size: 350px 200px;
    animation: twinkle 4s infinite;
  }
  .stars2 {
    background:
      radial-gradient(1px 1px at 50px 20px, #d8b4ff, transparent),
      radial-gradient(1px 1px at 120px 60px, #d8b4ff, transparent),
      radial-gradient(1px 1px at 200px 30px, #d8b4ff, transparent),
      radial-gradient(1px 1px at 280px 100px, #d8b4ff, transparent);
    background-repeat: repeat;
    background-size: 400px 150px;
    animation: twinkle 6s infinite 1s;
  }
  .stars3 {
    background:
      radial-gradient(1px 1px at 30px 40px, #f0abff, transparent),
      radial-gradient(1px 1px at 180px 20px, #f0abff, transparent),
      radial-gradient(2px 2px at 260px 130px, #f0abff, transparent),
      radial-gradient(1px 1px at 380px 90px, #f0abff, transparent);
    background-repeat: repeat;
    background-size: 450px 250px;
    animation: twinkle 8s infinite 2s;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 30% 40%, rgba(120, 40, 200, 0.35), transparent 60%),
      radial-gradient(circle at 70% 70%, rgba(80, 20, 160, 0.4), transparent 60%),
      linear-gradient(160deg, #1a0733 0%, #0d0620 50%, #1f0a3d 100%);
    z-index: 0;
    pointer-events: none;
  }

  /* ===== Кнопка Назад (левый верхний угол) ===== */
  .back-btn {
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 22px 12px 18px;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.5px;
    color: #e8d5ff;
    text-decoration: none;
    border-radius: 50px;
    background: rgba(60, 20, 120, 0.55);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(180, 130, 255, 0.45);
    box-shadow:
      0 4px 20px rgba(120, 40, 200, 0.4),
      inset 0 1px 0 rgba(255, 255, 255, 0.15);
    transition: all 0.3s ease;
    min-height: 48px;
    touch-action: manipulation;
  }
  .back-btn:hover {
    background: rgba(120, 50, 200, 0.7);
    border-color: rgba(220, 180, 255, 0.7);
    box-shadow:
      0 6px 28px rgba(180, 100, 255, 0.7),
      0 0 40px rgba(140, 60, 220, 0.4),
      inset 0 1px 0 rgba(255, 255, 255, 0.25);
  }
  .back-btn:active {
    transform: scale(0.96);
  }
  .back-btn .back-arrow {
    display: inline-block;
    font-size: 18px;
    line-height: 1;
  }

  /* ===== Окно с презентацией ===== */
  .window {
    position: relative;
    z-index: 5;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: 80px 20px 20px;
    gap: 0;
  }

  .window-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 14px 18px;
    border-radius: 18px 18px 0 0;
    background: rgba(60, 20, 120, 0.45);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(180, 130, 255, 0.35);
    border-bottom: none;
    flex-shrink: 0;
  }
  .window-title {
    font-family: 'Segoe Script', cursive;
    font-size: 20px;
    color: #e8d5ff;
    text-shadow: 0 0 10px rgba(180, 100, 255, 0.7);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .window-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .window-link {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 600;
    color: #e8d5ff;
    text-decoration: none;
    background: rgba(168, 85, 247, 0.3);
    border: 1px solid rgba(180, 130, 255, 0.45);
    border-radius: 50px;
    transition: all 0.25s ease;
    white-space: nowrap;
    min-height: 44px;
    touch-action: manipulation;
  }
  .window-link:hover {
    background: rgba(168, 85, 247, 0.55);
    box-shadow: 0 0 15px rgba(200, 120, 255, 0.6);
  }
  .window-link:active {
    transform: scale(0.96);
  }

  .window-body {
    position: relative;
    flex: 1;
    border-radius: 0 0 18px 18px;
    background: #150826;
    border: 1px solid rgba(180, 130, 255, 0.35);
    box-shadow:
      0 0 40px rgba(168, 85, 247, 0.45),
      0 0 80px rgba(124, 58, 237, 0.3),
      inset 0 0 60px rgba(120, 40, 200, 0.15);
    overflow: hidden;
    min-height: 0;
  }
  .window-body iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
    opacity: 0;
    transition: opacity 0.5s ease;
  }
  .window-body iframe.loaded {
    opacity: 1;
  }

  /* ===== Загрузка (спиннер) ===== */
  .loader {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    background: linear-gradient(160deg, #1a0733 0%, #0d0620 60%, #1f0a3d 100%);
    z-index: 10;
    transition: opacity 0.5s ease, visibility 0.5s ease;
  }
  .loader.hidden {
    opacity: 0;
    visibility: hidden;
  }

  .spinner {
    position: relative;
    width: 80px;
    height: 80px;
  }
  .spinner::before,
  .spinner::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 3px solid transparent;
  }
  .spinner::before {
    border-top-color: #a855f7;
    border-right-color: #a855f7;
    animation: spin 1.2s linear infinite;
    box-shadow: 0 0 20px rgba(168, 85, 247, 0.8);
  }
  .spinner::after {
    inset: 12px;
    border-bottom-color: #e8d5ff;
    border-left-color: #e8d5ff;
    animation: spin 1.8s linear infinite reverse;
    box-shadow: 0 0 15px rgba(232, 213, 255, 0.6);
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .loader-text {
    font-family: 'Segoe Script', cursive;
    font-size: 22px;
    color: #e8d5ff;
    text-shadow: 0 0 15px rgba(180, 100, 255, 0.9),
                 0 0 30px rgba(140, 60, 220, 0.6);
    letter-spacing: 1px;
    animation: pulseText 2s ease-in-out infinite;
  }
  @keyframes pulseText {
    0%, 100% { opacity: 0.7; }
    50% { opacity: 1; }
  }

  .loader-text .dots span {
    display: inline-block;
    animation: dotJump 1.4s infinite;
  }
  .loader-text .dots span:nth-child(2) { animation-delay: 0.2s; }
  .loader-text .dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes dotJump {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  /* ===== Мобильная адаптация ===== */
  @media (max-width: 700px) {
    .back-btn {
      top: 12px;
      left: 12px;
      padding: 10px 18px 10px 14px;
      font-size: 15px;
      min-height: 46px;
    }

    .window {
      padding: 72px 10px 10px;
    }

    .window-header {
      padding: 12px 14px;
      border-radius: 16px 16px 0 0;
      flex-wrap: nowrap;
    }
    .window-title {
      font-size: 17px;
      flex-shrink: 1;
      min-width: 0;
    }
    .window-actions {
      gap: 6px;
    }
    .window-link {
      padding: 10px 12px;
      font-size: 13px;
      min-height: 46px;
      gap: 4px;
    }
    /* Скрываем текст на самых узких экранах, оставляем иконку */
    .window-link .link-text {
      display: none;
    }
    .window-link .link-icon {
      font-size: 18px;
    }
    .window-body {
      border-radius: 0 0 16px 16px;
    }

    .spinner { width: 64px; height: 64px; }
    .loader-text { font-size: 19px; }
  }

  /* ===== Очень узкие экраны ===== */
  @media (max-width: 380px) {
    .back-btn {
      padding: 9px 14px 9px 12px;
      font-size: 14px;
      min-height: 44px;
    }
    .window { padding: 68px 8px 8px; }
    .window-title { font-size: 15px; }
    .window-link { padding: 9px 10px; min-height: 44px; }
    .spinner { width: 56px; height: 56px; }
    .loader-text { font-size: 17px; }
  }
</style>
</head>
<body>
  <div class="stars"></div>
  <div class="stars2"></div>
  <div class="stars3"></div>

  <!-- Кнопка Назад -->
  <a href="https://vadimtychkov17-a11y.github.io/choice" class="back-btn">
    <span class="back-arrow">←</span>
    Назад
  </a>

  <div class="window">
    <div class="window-header">
      <span class="window-title">Презентация</span>
      <div class="window-actions">
        <a class="window-link" id="downloadLink" href="#" download>
          <span class="link-icon">⬇</span>
          <span class="link-text">Скачать</span>
        </a>
        <a class="window-link" id="newTabLink" href="#" target="_blank" rel="noopener">
          <span class="link-icon">↗</span>
          <span class="link-text">В новой вкладке</span>
        </a>
      </div>
    </div>

    <div class="window-body">
      <div class="loader" id="loader">
        <div class="spinner"></div>
        <div class="loader-text">
          Загрузка<span class="dots"><span>.</span><span>.</span><span>.</span></span>
        </div>
      </div>

      <iframe id="pdfFrame" src="about:blank" title="Презентация" allowfullscreen></iframe>
    </div>
  </div>

  <script>
    // ===== НАСТРОЙКИ =====
    const PDF_URL = 'presentation.pdf';       // для просмотра в окне
    const PPTX_URL = 'presentation.pptx';     // для скачивания (оригинал)

    const ABSOLUTE_PDF_URL = new URL(PDF_URL, window.location.href).href;
    const VIEWER_URL = 'https://docs.google.com/viewer?url=' +
                       encodeURIComponent(ABSOLUTE_PDF_URL) +
                       '&embedded=true';

    // ===== ЭЛЕМЕНТЫ =====
    const frame = document.getElementById('pdfFrame');
    const loader = document.getElementById('loader');
    const downloadLink = document.getElementById('downloadLink');
    const newTabLink = document.getElementById('newTabLink');

    // Скачивание — оригинал PPTX, в новой вкладке — PDF
    downloadLink.href = PPTX_URL;
    newTabLink.href = PDF_URL;

    // ===== ЗАГРУЗКА =====
    frame.src = VIEWER_URL;

    frame.addEventListener('load', () => {
      setTimeout(() => {
        loader.classList.add('hidden');
        frame.classList.add('loaded');
      }, 600);
    });

    // Страховка: если долго не загружается — скрываем спиннер через 12 секунд
    setTimeout(() => {
      if (!frame.classList.contains('loaded')) {
        loader.classList.add('hidden');
        frame.classList.add('loaded');
      }
    }, 12000);
  </script>
</body>
</html>
