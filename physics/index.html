<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d0620">
<title>Симулятор физики — шарики</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: #0d0620;
    color: #fff;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;
  }

  .stars, .stars2 {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }
  .stars {
    background:
      radial-gradient(2px 2px at 20px 30px, #fff, transparent),
      radial-gradient(2px 2px at 40px 70px, #fff, transparent),
      radial-gradient(1px 1px at 90px 40px, #fff, transparent),
      radial-gradient(1px 1px at 130px 80px, #fff, transparent),
      radial-gradient(2px 2px at 160px 120px, #fff, transparent),
      radial-gradient(1px 1px at 200px 50px, #fff, transparent);
    background-repeat: repeat;
    background-size: 350px 200px;
    animation: twinkle 4s infinite;
  }
  .stars2 {
    background:
      radial-gradient(1px 1px at 50px 20px, #d8b4ff, transparent),
      radial-gradient(1px 1px at 200px 30px, #d8b4ff, transparent),
      radial-gradient(1px 1px at 280px 100px, #d8b4ff, transparent);
    background-repeat: repeat;
    background-size: 400px 150px;
    animation: twinkle 6s infinite 1s;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.4; }
    50%      { opacity: 1; }
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 30% 40%, rgba(120, 40, 200, 0.25), transparent 60%),
      radial-gradient(circle at 70% 70%, rgba(80, 20, 160, 0.3), transparent 60%),
      linear-gradient(160deg, #1a0733 0%, #0d0620 50%, #1f0a3d 100%);
    z-index: 0;
    pointer-events: none;
    transition: background 0.5s ease;
  }

  body.danger::before {
    background:
      radial-gradient(circle at 30% 40%, rgba(220, 40, 60, 0.35), transparent 60%),
      radial-gradient(circle at 70% 70%, rgba(180, 20, 40, 0.4), transparent 60%),
      linear-gradient(160deg, #3a0a12 0%, #2a0510 50%, #3d0a18 100%);
  }
  body.danger .stars,
  body.danger .stars2 {
    opacity: 0.5;
    filter: hue-rotate(-30deg) saturate(1.5);
  }
  body.danger .hint,
  body.danger .header,
  body.danger .bottom-bar {
    filter: brightness(0.85) hue-rotate(-20deg);
  }

  #stage {
    position: fixed;
    inset: 0;
    z-index: 1;
    display: block;
    touch-action: none;
    cursor: grab;
  }
  #stage.grabbing { cursor: grabbing; }

  .ui {
    position: fixed;
    inset: 0;
    z-index: 5;
    pointer-events: none;
  }
  .ui > * { pointer-events: auto; }

  .header {
    position: fixed;
    top: 16px;
    right: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 16px 8px 14px;
    border-radius: 50px;
    background: rgba(60, 20, 120, 0.45);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(180, 130, 255, 0.35);
    box-shadow: 0 4px 20px rgba(120, 40, 200, 0.35);
    z-index: 10;
  }
  .header .brand {
    font-family: 'Segoe Script', 'Brush Script MT', cursive;
    font-size: clamp(18px, 4vw, 24px);
    color: #e8d5ff;
    text-shadow: 0 0 12px rgba(180, 100, 255, 0.8);
    letter-spacing: 1px;
    line-height: 1;
  }

  .hint {
    position: fixed;
    top: 20px;
    left: 20px;
    font-size: 13px;
    color: #c9a9ff;
    background: rgba(60, 20, 120, 0.35);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: 8px 14px;
    border-radius: 12px;
    border: 1px solid rgba(180, 130, 255, 0.25);
    opacity: 0.85;
    pointer-events: none;
    z-index: 10;
    max-width: 220px;
    line-height: 1.35;
  }

  .bottom-bar {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    display: flex;
    align-items: stretch;
    gap: 10px;
    z-index: 10;
    padding-bottom: env(safe-area-inset-bottom);
  }

  .count-input {
    width: 78px;
    padding: 16px 8px;
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    text-align: center;
    color: #fff;
    background: rgba(60, 20, 120, 0.55);
    border: 1px solid rgba(180, 130, 255, 0.5);
    border-radius: 50px;
    outline: none;
    -webkit-appearance: none;
    -moz-appearance: textfield;
    appearance: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
    min-height: 56px;
    touch-action: manipulation;
  }
  .count-input::-webkit-outer-spin-button,
  .count-input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  .count-input:focus {
    border-color: #c084fc;
    box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.3);
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 16px 28px;
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: #fff;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1),
                box-shadow 0.2s ease,
                background 0.2s ease;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    min-height: 56px;
    white-space: nowrap;
  }

  .btn-create {
    background: linear-gradient(135deg, #7c3aed 0%, #a855f7 100%);
    box-shadow:
      0 8px 24px rgba(168, 85, 247, 0.5),
      0 0 40px rgba(124, 58, 237, 0.3),
      inset 0 1px 0 rgba(255, 255, 255, 0.35);
  }
  .btn-create:hover {
    transform: translateY(-3px) scale(1.03);
    box-shadow:
      0 12px 32px rgba(200, 120, 255, 0.7),
      0 0 60px rgba(140, 60, 220, 0.5),
      inset 0 1px 0 rgba(255, 255, 255, 0.5);
  }
  .btn-create:active { transform: translateY(-1px) scale(1.0); }

  .btn-clear {
    background: linear-gradient(135deg, #dc4a5a 0%, #e6397a 100%);
    box-shadow:
      0 8px 24px rgba(230, 57, 122, 0.5),
      0 0 40px rgba(200, 40, 100, 0.3),
      inset 0 1px 0 rgba(255, 255, 255, 0.3);
  }
  .btn-clear:hover {
    transform: translateY(-3px) scale(1.03);
    box-shadow:
      0 12px 32px rgba(255, 100, 150, 0.7),
      0 0 60px rgba(200, 60, 120, 0.5),
      inset 0 1px 0 rgba(255, 255, 255, 0.45);
  }
  .btn-clear:active { transform: translateY(-1px) scale(1.0); }

  .btn-clear.confirming {
    background: linear-gradient(135deg, #ff3b3b 0%, #d93025 100%);
    animation: confirmPulse 0.8s ease-in-out infinite;
  }
  @keyframes confirmPulse {
    0%, 100% {
      box-shadow:
        0 8px 24px rgba(255, 60, 60, 0.6),
        0 0 40px rgba(220, 40, 40, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.35);
    }
    50% {
      box-shadow:
        0 12px 36px rgba(255, 100, 100, 0.9),
        0 0 60px rgba(220, 60, 60, 0.6),
        inset 0 1px 0 rgba(255, 255, 255, 0.5);
    }
  }

  .overflow-screen {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(120, 10, 30, 0.55);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease;
  }
  .overflow-screen.active {
    opacity: 1;
    pointer-events: auto;
  }

  .overflow-screen .content {
    max-width: 520px;
    padding: 40px 32px;
    background: linear-gradient(160deg, rgba(200, 30, 60, 0.45), rgba(140, 10, 40, 0.55));
    border: 1px solid rgba(255, 120, 140, 0.5);
    border-radius: 24px;
    box-shadow:
      0 20px 60px rgba(200, 30, 60, 0.5),
      inset 0 1px 0 rgba(255, 255, 255, 0.2);
    transform: scale(0.92);
    transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .overflow-screen.active .content {
    transform: scale(1);
  }

  .overflow-screen .emoji {
    font-size: 64px;
    line-height: 1;
    display: block;
    margin-bottom: 20px;
    animation: shake 0.6s ease-in-out infinite;
  }
  @keyframes shake {
    0%, 100% { transform: rotate(-4deg); }
    50%      { transform: rotate(4deg); }
  }

  .overflow-screen h2 {
    font-family: 'Segoe Script', 'Brush Script MT', cursive;
    font-size: clamp(24px, 5vw, 38px);
    color: #fff;
    line-height: 1.25;
    margin-bottom: 16px;
    text-shadow: 0 4px 20px rgba(255, 100, 120, 0.7);
  }

  .overflow-screen p {
    font-size: clamp(14px, 2.5vw, 17px);
    color: #ffd5dd;
    line-height: 1.5;
    opacity: 0.95;
  }

  .overflow-screen .counter {
    margin-top: 20px;
    font-size: 14px;
    color: #ffb0c0;
    letter-spacing: 1px;
    opacity: 0.9;
    font-variant-numeric: tabular-nums;
  }

  @media (max-width: 600px) {
    .hint {
      top: 14px;
      left: 14px;
      font-size: 12px;
      padding: 6px 10px;
      max-width: 160px;
    }
    .header {
      top: 14px;
      right: 14px;
      padding: 6px 12px 6px 10px;
    }
    .bottom-bar {
      bottom: 16px;
      gap: 8px;
      width: calc(100% - 24px);
      justify-content: center;
    }
    .count-input {
      width: 62px;
      padding: 14px 6px;
      font-size: 15px;
      min-height: 52px;
    }
    .btn {
      flex: 1;
      padding: 14px 12px;
      font-size: 15px;
      min-height: 52px;
      max-width: 180px;
    }
  }

  @media (max-width: 380px) {
    .count-input { width: 54px; font-size: 14px; }
    .btn { padding: 12px 8px; font-size: 14px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .stars, .stars2 { animation: none !important; }
    .btn, .btn-clear.confirming { animation: none !important; transition: none !important; }
    .overflow-screen .emoji { animation: none !important; }
  }
</style>
</head>
<body>

<div class="stars"></div>
<div class="stars2"></div>

<canvas id="stage"></canvas>

<div class="ui">
  <div class="hint">Введи число и нажми «Создать»</div>
  <div class="header">
    <span class="brand">Vindim</span>
  </div>
  <div class="bottom-bar">
    <input class="count-input" id="countInput" type="number" min="1" max="100" value="1" inputmode="numeric" aria-label="Сколько шариков">
    <button class="btn btn-create" id="createBtn">Создать</button>
    <button class="btn btn-clear" id="clearBtn">Очистить</button>
  </div>
</div>

<div class="overflow-screen" id="overflowScreen">
  <div class="content">
    <span class="emoji">🚫</span>
    <h2>Нельзя так много шариков чел</h2>
    <p>Максимум 1000. Сейчас всё уберём.</p>
    <div class="counter" id="overflowCounter"></div>
  </div>
</div>

<script>
(function () {
  'use strict';

  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d', { alpha: true });

  let W = 0, H = 0;
  let DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  const GRAVITY       = 1800;
  const SUBSTEP       = 1 / 120;
  const MAX_STEPS     = 5;
  const RESTITUTION   = 0.15;
  const FRICTION      = 0.4;
  const LINEAR_DAMP   = 0.999;
  const ANGULAR_DAMP  = 0.995;

  const SLEEP_LINEAR  = 25;
  const SLEEP_ANGULAR = 0.4;
  const SLEEP_TIME    = 0.25;

  const FORCE_SLEEP_LINEAR  = 8;
  const FORCE_SLEEP_ANGULAR = 0.15;

  const SLOP          = 0.5;

  const MIN_IMPACT_SPEED = 25;

  const MAX_BOXES = 1000;

  /* ---------- Круглое тело ---------- */
  function Ball(x, y, r, opts) {
    opts = opts || {};
    this.x = x;
    this.y = y;
    this.vx = 0;
    this.vy = 0;
    this.angle = 0;      // только для визуала — рисуем блик с поворотом
    this.va = 0;
    this.r = r;
    this.isStatic = !!opts.static;
    this.color = opts.color || '#a78bfa';
    this.sleepTimer = 0;
    this.sleeping = false;

    if (this.isStatic) {
      this.invMass = 0;
      this.invInertia = 0;
    } else {
      const m = Math.PI * r * r * 0.001;
      this.invMass = 1 / m;
      const I = 0.5 * m * r * r;
      this.invInertia = 1 / I;
    }
  }

  Ball.prototype.applyImpulse = function (jx, jy, rx, ry) {
    if (this.isStatic) return;
    this.vx += jx * this.invMass;
    this.vy += jy * this.invMass;
    this.va += (rx * jy - ry * jx) * this.invInertia;
  };

  Ball.prototype.wake = function () {
    this.sleeping = false;
    this.sleepTimer = 0;
  };

  /* ---------- Мир ---------- */
  const balls = [];
  const staticBalls = [];

  function buildWalls() {
    staticBalls.length = 0;
    const T = 200;
    // Пол — плоский сверху (рисуем как «платформу» — но это круг радиуса W)
    // Для кругов делаем стены как очень большие круги, но проще — прямоугольники не нужны.
    // Однако у нас всё круглое. Поэтому стены делаем как огромные круги далеко за экраном.
    // Это работает, потому что столкновение круг-круг — просто расстояние.

    const wallR = 3000;
    // Пол — гигантский круг под экраном
    staticBalls.push(new Ball(W / 2, H + wallR - 4, wallR, { static: true }));
    // Левая стена
    staticBalls.push(new Ball(-wallR + 4, H / 2, wallR, { static: true }));
    // Правая стена
    staticBalls.push(new Ball(W + wallR - 4, H / 2, wallR, { static: true }));
    // Потолок
    staticBalls.push(new Ball(W / 2, -wallR + 4, wallR, { static: true }));
  }
  buildWalls();
  window.addEventListener('resize', buildWalls);

  /* ---------- Столкновение круг-круг ---------- */
  function resolvePair(a, b) {
    if (a.invMass === 0 && b.invMass === 0) return;
    if (a.sleeping && b.sleeping) return;

    const dx = b.x - a.x;
    const dy = b.y - a.y;
    const distSq = dx * dx + dy * dy;
    const rSum = a.r + b.r;
    const rSumSq = rSum * rSum;
    if (distSq >= rSumSq) return;

    let dist = Math.sqrt(distSq);
    if (dist < 0.0001) {
      // Совпали центры — расталкиваем по случайной оси
      dist = 0.0001;
    }

    const nx = dx / dist;
    const ny = dy / dist;
    const depth = rSum - dist;

    // Позиционная коррекция
    const invSum = a.invMass + b.invMass;
    if (invSum > 0) {
      const correction = Math.max(depth - SLOP, 0) / invSum * 0.6;
      a.x -= nx * correction * a.invMass;
      a.y -= ny * correction * a.invMass;
      b.x += nx * correction * b.invMass;
      b.y += ny * correction * b.invMass;
    }

    // Точка контакта — на границе кругов
    const contactX = a.x + nx * a.r;
    const contactY = a.y + ny * a.r;

    const rax = contactX - a.x;
    const ray = contactY - a.y;
    const rbx = contactX - b.x;
    const rby = contactY - b.y;

    const rvx = (b.vx - b.va * rby) - (a.vx - a.va * ray);
    const rvy = (b.vy + b.va * rbx) - (a.vy + a.va * rax);
    const vn = rvx * nx + rvy * ny;

    if (vn > 0) return;
    if (Math.abs(vn) < MIN_IMPACT_SPEED) return;

    if (a.sleeping) a.wake();
    if (b.sleeping) b.wake();

    const raCrossN = rax * ny - ray * nx;
    const rbCrossN = rbx * ny - rby * nx;
    const invMassSum = a.invMass + b.invMass +
                       raCrossN * raCrossN * a.invInertia +
                       rbCrossN * rbCrossN * b.invInertia;
    if (invMassSum === 0) return;

    const e = (Math.abs(vn) < 100) ? 0 : RESTITUTION;
    const jn = -(1 + e) * vn / invMassSum;

    const jnx = nx * jn;
    const jny = ny * jn;
    a.applyImpulse(-jnx, -jny, rax, ray);
    b.applyImpulse(jnx, jny, rbx, rby);

    // Трение
    const rvx2 = (b.vx - b.va * rby) - (a.vx - a.va * ray);
    const rvy2 = (b.vy + b.va * rbx) - (a.vy + a.va * rax);
    let tx = rvx2 - (rvx2 * nx + rvy2 * ny) * nx;
    let ty = rvy2 - (rvx2 * nx + rvy2 * ny) * ny;
    const tLen = Math.hypot(tx, ty);
    if (tLen > 1e-4) {
      tx /= tLen;
      ty /= tLen;
      const raCrossT = rax * ty - ray * tx;
      const rbCrossT = rbx * ty - rby * tx;
      const invMassSumT = a.invMass + b.invMass +
                          raCrossT * raCrossT * a.invInertia +
                          rbCrossT * rbCrossT * b.invInertia;
      let jt = -(rvx2 * tx + rvy2 * ty) / invMassSumT;
      const maxF = FRICTION * Math.abs(jn);
      if (jt >  maxF) jt =  maxF;
      if (jt < -maxF) jt = -maxF;
      a.applyImpulse(-tx * jt, -ty * jt, rax, ray);
      b.applyImpulse( tx * jt,  ty * jt, rbx, rby);
    }
  }

  function integrate(ball, dt) {
    if (ball.isStatic || ball.sleeping) return;
    if (ball === dragged) return;

    ball.vy += GRAVITY * dt;
    ball.vx *= LINEAR_DAMP;
    ball.vy *= LINEAR_DAMP;
    ball.va *= ANGULAR_DAMP;

    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;
    ball.angle += ball.va * dt;

    const speed = Math.hypot(ball.vx, ball.vy);

    if (speed < FORCE_SLEEP_LINEAR && Math.abs(ball.va) < FORCE_SLEEP_ANGULAR) {
      ball.sleeping = true;
      ball.vx = 0;
      ball.vy = 0;
      ball.va = 0;
      ball.sleepTimer = 0;
      return;
    }

    if (speed < SLEEP_LINEAR && Math.abs(ball.va) < SLEEP_ANGULAR) {
      ball.sleepTimer += dt;
      if (ball.sleepTimer > SLEEP_TIME) {
        ball.sleeping = true;
        ball.vx = 0;
        ball.vy = 0;
        ball.va = 0;
      }
    } else {
      ball.sleepTimer = 0;
    }
  }

  function step(dt) {
    for (let i = 0; i < balls.length; i++) integrate(balls[i], dt);

    for (let i = 0; i < balls.length; i++) {
      const a = balls[i];
      for (let s = 0; s < staticBalls.length; s++) {
        resolvePair(a, staticBalls[s]);
      }
      for (let j = i + 1; j < balls.length; j++) {
        resolvePair(a, balls[j]);
      }
    }
  }

  /* ---------- Драг ---------- */
  let dragged = null;
  const dragLocal = { x: 0, y: 0 };
  const dragTarget = { x: 0, y: 0 };
  const prevPointer = { x: 0, y: 0 };
  const pointerVel = { x: 0, y: 0 };
  let pointerTime = 0;

  function getPointer(e) {
    const rect = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - rect.left, y: t.clientY - rect.top };
  }

  function pointInBall(px, py, ball) {
    const dx = px - ball.x;
    const dy = py - ball.y;
    return dx * dx + dy * dy <= ball.r * ball.r;
  }

  function onDown(e) {
    if (overflowTriggered) return;
    const p = getPointer(e);
    prevPointer.x = p.x;
    prevPointer.y = p.y;
    pointerVel.x = 0;
    pointerVel.y = 0;
    pointerTime = performance.now();

    for (let i = balls.length - 1; i >= 0; i--) {
      const b = balls[i];
      if (pointInBall(p.x, p.y, b)) {
        dragged = b;
        b.wake();
        dragLocal.x = p.x - b.x;
        dragLocal.y = p.y - b.y;
        dragTarget.x = p.x;
        dragTarget.y = p.y;
        canvas.classList.add('grabbing');
        e.preventDefault();
        return;
      }
    }
  }

  function onMove(e) {
    if (overflowTriggered) return;
    const p = getPointer(e);
    const now = performance.now();
    const dt = Math.max((now - pointerTime) / 1000, 1e-3);
    pointerVel.x = (p.x - prevPointer.x) / dt;
    pointerVel.y = (p.y - prevPointer.y) / dt;
    prevPointer.x = p.x;
    prevPointer.y = p.y;
    pointerTime = now;

    if (!dragged) return;
    e.preventDefault();
    dragTarget.x = p.x;
    dragTarget.y = p.y;
  }

  function onUp() {
    if (!dragged) return;
    dragged.vx = pointerVel.x * 0.6;
    dragged.vy = pointerVel.y * 0.6;
    dragged.wake();
    dragged = null;
    canvas.classList.remove('grabbing');
  }

  canvas.addEventListener('mousedown', onDown);
  canvas.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
  canvas.addEventListener('touchstart', onDown, { passive: false });
  canvas.addEventListener('touchmove', onMove, { passive: false });
  window.addEventListener('touchend', onUp);
  window.addEventListener('touchcancel', onUp);

  function applyDrag() {
    if (!dragged) return;
    dragged.wake();

    const wx = dragTarget.x - dragLocal.x;
    const wy = dragTarget.y - dragLocal.y;

    const k = 25;
    const maxSpeed = 2400;
    let vx = (wx - dragged.x) * k;
    let vy = (wy - dragged.y) * k;
    const sp = Math.hypot(vx, vy);
    if (sp > maxSpeed) {
      vx = vx / sp * maxSpeed;
      vy = vy / sp * maxSpeed;
    }
    dragged.vx = vx;
    dragged.vy = vy;
    dragged.va *= 0.85;
  }

  let overflowTriggered = false;

  function checkOverflow() {
    if (overflowTriggered) return;
    if (balls.length >= MAX_BOXES) {
      overflowTriggered = true;
      triggerOverflow();
    }
  }

  function triggerOverflow() {
    document.body.classList.add('danger');

    const screen = document.getElementById('overflowScreen');
    const counterEl = document.getElementById('overflowCounter');
    screen.classList.add('active');

    dragged = null;
    canvas.classList.remove('grabbing');

    const totalTime = 10000;
    const startCount = balls.length;
    const startTime = performance.now();

    function removeStep() {
      const elapsed = performance.now() - startTime;
      const progress = Math.min(elapsed / totalTime, 1);

      const targetCount = Math.floor(startCount * (1 - progress));
      const toRemove = balls.length - targetCount;

      if (toRemove > 0) {
        balls.splice(0, toRemove);
      }

      counterEl.textContent = 'Осталось: ' + balls.length;

      if (progress < 1) {
        requestAnimationFrame(removeStep);
      } else {
        balls.length = 0;
        counterEl.textContent = '';
        screen.classList.remove('active');
        document.body.classList.remove('danger');
        overflowTriggered = false;
        resetConfirm();
      }
    }

    requestAnimationFrame(removeStep);
  }

  const PALETTE = ['#a78bfa', '#8b5cf6', '#c4b5fd', '#7c3aed', '#b39ddb', '#9575cd'];

  function spawnBall() {
    if (balls.length >= MAX_BOXES) {
      checkOverflow();
      return;
    }

    const r = 25 + Math.random() * 20;
    const x = W * 0.25 + Math.random() * W * 0.5;
    const y = -r - Math.random() * 100;
    const color = PALETTE[Math.floor(Math.random() * PALETTE.length)];
    const b = new Ball(x, y, r, { color: color });
    b.vx = (Math.random() - 0.5) * 100;
    b.vy = 100 + Math.random() * 100;
    b.va = (Math.random() - 0.5) * 4;
    balls.push(b);

    checkOverflow();
  }

  let lastTime = performance.now();
  let accumulator = 0;

  function loop(now) {
    let dt = (now - lastTime) / 1000;
    lastTime = now;
    if (dt > 0.1) dt = 0.1;

    accumulator += dt;
    let steps = 0;
    while (accumulator >= SUBSTEP && steps < MAX_STEPS) {
      applyDrag();
      step(SUBSTEP);
      accumulator -= SUBSTEP;
      steps++;
    }
    if (accumulator > SUBSTEP * 2) accumulator = 0;

    ctx.clearRect(0, 0, W, H);

    for (let i = 0; i < balls.length; i++) {
      const b = balls[i];

      // Основной круг с градиентом
      const grad = ctx.createRadialGradient(
        b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.1,
        b.x, b.y, b.r
      );
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(0.15, b.color);
      grad.addColorStop(1, shadeColor(b.color, -30));

      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();

      // Тонкая обводка
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Блик сверху — вращается вместе с angle, чтобы было видно, что шар крутится
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(b.angle);
      ctx.beginPath();
      ctx.arc(-b.r * 0.35, -b.r * 0.35, b.r * 0.18, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
      ctx.fill();
      ctx.restore();
    }

    requestAnimationFrame(loop);
  }

  // Затемнение цвета для нижней части градиента
  function shadeColor(hex, percent) {
    const num = parseInt(hex.replace('#', ''), 16);
    let r = (num >> 16) + percent;
    let g = ((num >> 8) & 0x00FF) + percent;
    let b = (num & 0x0000FF) + percent;
    r = Math.max(0, Math.min(255, r));
    g = Math.max(0, Math.min(255, g));
    b = Math.max(0, Math.min(255, b));
    return '#' + (r << 16 | g << 8 | b).toString(16).padStart(6, '0');
  }

  requestAnimationFrame(loop);

  const createBtn = document.getElementById('createBtn');
  const clearBtn = document.getElementById('clearBtn');
  const countInput = document.getElementById('countInput');
  let confirmTimer = null;
  let isConfirming = false;

  createBtn.addEventListener('click', function () {
    if (overflowTriggered) return;
    resetConfirm();

    let count = parseInt(countInput.value, 10);
    if (isNaN(count) || count < 1) count = 1;
    if (count > 100) count = 100;
    countInput.value = count;

    for (let i = 0; i < count; i++) {
      (function (index) {
        setTimeout(function () {
          if (overflowTriggered) return;
          spawnBall();
        }, index * 80);
      })(i);
    }
  });

  countInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      createBtn.click();
    }
  });

  countInput.addEventListener('input', function () {
    let val = parseInt(countInput.value, 10);
    if (isNaN(val)) return;
    if (val > 100) countInput.value = 100;
    if (val < 1 && countInput.value !== '') countInput.value = 1;
  });

  clearBtn.addEventListener('click', function () {
    if (overflowTriggered) return;
    if (!isConfirming) {
      isConfirming = true;
      clearBtn.textContent = 'Точно?';
      clearBtn.classList.add('confirming');
      confirmTimer = setTimeout(function () {
        resetConfirm();
      }, 3000);
    } else {
      balls.length = 0;
      resetConfirm();
    }
  });

  function resetConfirm() {
    if (confirmTimer) {
      clearTimeout(confirmTimer);
      confirmTimer = null;
    }
    isConfirming = false;
    clearBtn.textContent = 'Очистить';
    clearBtn.classList.remove('confirming');
  }

  setTimeout(spawnBall, 400);
  setTimeout(spawnBall, 800);

})();
</script>
</body>
</html>
