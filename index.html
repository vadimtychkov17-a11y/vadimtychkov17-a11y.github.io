<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
 <link rel="icon" type="image/x-icon" href="/favicon.ico">
 <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
<meta name="theme-color" content="#0d0620">
<title>Vindim</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    min-height: 100%;
    overflow-x: hidden;
    font-family: 'Segoe UI', sans-serif;
    background: #0d0620;
    color: #fff;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }

  /* ===== Звёздный фон ===== */
  .stars, .stars2, .stars3 {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }
  .stars {
    background:
      radial-gradient(2px 2px at 20px 30px, #fff, transparent),
      radial-gradient(2px 2px at 40px 70px, #fff, transparent),
      radial-gradient(1px 1px at 90px 40px, #fff, transparent),
      radial-gradient(1px 1px at 130px 80px, #fff, transparent),
      radial-gradient(2px 2px at 160px 120px, #fff, transparent),
      radial-gradient(1px 1px at 200px 50px, #fff, transparent),
      radial-gradient(1px 1px at 250px 150px, #fff, transparent),
      radial-gradient(2px 2px at 300px 90px, #fff, transparent);
    background-repeat: repeat;
    background-size: 350px 200px;
    animation: twinkle 4s infinite;
  }
  .stars2 {
    background:
      radial-gradient(1px 1px at 50px 20px, #d8b4ff, transparent),
      radial-gradient(1px 1px at 120px 60px, #d8b4ff, transparent),
      radial-gradient(1px 1px at 200px 30px, #d8b4ff, transparent),
      radial-gradient(1px 1px at 280px 100px, #d8b4ff, transparent);
    background-repeat: repeat;
    background-size: 400px 150px;
    animation: twinkle 6s infinite 1s;
  }
  .stars3 {
    background:
      radial-gradient(1px 1px at 30px 40px, #f0abff, transparent),
      radial-gradient(1px 1px at 180px 20px, #f0abff, transparent),
      radial-gradient(2px 2px at 260px 130px, #f0abff, transparent),
      radial-gradient(1px 1px at 380px 90px, #f0abff, transparent);
    background-repeat: repeat;
    background-size: 450px 250px;
    animation: twinkle 8s infinite 2s;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 30% 40%, rgba(120, 40, 200, 0.35), transparent 60%),
      radial-gradient(circle at 70% 70%, rgba(80, 20, 160, 0.4), transparent 60%),
      linear-gradient(160deg, #1a0733 0%, #0d0620 50%, #1f0a3d 100%);
    z-index: 0;
    pointer-events: none;
  }

  /* ===== Шапка (Vindim) ===== */
  .header {
    position: fixed;
    top: 16px;
    right: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 10;
    padding: 8px 16px 8px 14px;
    border-radius: 50px;
    background: rgba(60, 20, 120, 0.35);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(180, 130, 255, 0.35);
    box-shadow: 0 4px 20px rgba(120, 40, 200, 0.35);
  }
  .header img {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid rgba(200, 150, 255, 0.6);
    box-shadow: 0 0 12px rgba(180, 100, 255, 0.6);
    flex-shrink: 0;
  }
  .header .brand {
    font-family: 'Segoe Script', cursive;
    font-size: 24px;
    color: #e8d5ff;
    text-shadow: 0 0 12px rgba(180, 100, 255, 0.8),
                 0 0 20px rgba(140, 60, 220, 0.5);
    letter-spacing: 1px;
    line-height: 1;
  }

  /* ===== Центр ===== */
  .center {
    position: relative;
    z-index: 5;
    min-height: 100vh;
    min-height: 100dvh; /* корректная высота на мобильных с учётом адресной строки */
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 100px 24px 60px;
  }

  .center h1 {
    font-family: 'Segoe Script', cursive;
    font-size: clamp(38px, 9vw, 72px);
    color: #f3e4ff;
    text-shadow: 0 0 20px rgba(180, 100, 255, 0.9),
                 0 0 40px rgba(140, 60, 220, 0.7),
                 0 0 60px rgba(90, 20, 180, 0.5);
    margin-bottom: 36px;
    letter-spacing: 2px;
    line-height: 1.15;
    max-width: 90vw;
  }

  /* ===== Кнопки ===== */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 20px 40px;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 1px;
    color: #fff;
    text-decoration: none;
    background: linear-gradient(135deg, #7c3aed 0%, #a855f7 50%, #7c3aed 100%);
    background-size: 200% 200%;
    border: 1px solid rgba(220, 180, 255, 0.5);
    border-radius: 50px;
    cursor: pointer;
    box-shadow:
      0 0 25px rgba(168, 85, 247, 0.7),
      0 0 50px rgba(124, 58, 237, 0.4),
      inset 0 1px 0 rgba(255, 255, 255, 0.3);
    transition: all 0.35s ease;
    animation: pulse 3s ease-in-out infinite;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    min-height: 56px; /* удобный размер для пальца */
    max-width: 90vw;
  }
  .btn:hover {
    transform: translateY(-3px) scale(1.05);
    background-position: 100% 50%;
    box-shadow:
      0 0 40px rgba(200, 120, 255, 0.9),
      0 0 80px rgba(140, 60, 220, 0.6),
      inset 0 1px 0 rgba(255, 255, 255, 0.4);
  }
  .btn:active {
    transform: translateY(-1px) scale(1.02);
  }
  @keyframes pulse {
    0%, 100% {
      box-shadow: 0 0 25px rgba(168, 85, 247, 0.7),
                  0 0 50px rgba(124, 58, 237, 0.4),
                  inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }
    50% {
      box-shadow: 0 0 35px rgba(200, 120, 255, 0.9),
                  0 0 70px rgba(140, 60, 220, 0.6),
                  inset 0 1px 0 rgba(255, 255, 255, 0.4);
    }
  }

  /* Блок кнопок */
  .buttons {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    width: 100%;
    max-width: 420px;
  }

  /* ===== Мобильная адаптация ===== */
  @media (max-width: 600px) {
    .header {
      top: 12px;
      right: 12px;
      padding: 7px 14px 7px 10px;
      gap: 8px;
    }
    .header img { width: 34px; height: 34px; }
    .header .brand { font-size: 20px; }

    .center {
      padding: 90px 20px 40px;
    }

    .center h1 {
      margin-bottom: 32px;
      font-size: clamp(34px, 11vw, 54px);
    }

    .btn {
      padding: 18px 32px;
      font-size: 17px;
      width: 100%;
      min-height: 60px;
    }

    .buttons {
      max-width: 100%;
      gap: 14px;
    }
  }

  /* Очень узкие экраны (маленькие телефоны) */
  @media (max-width: 380px) {
    .center h1 { font-size: 32px; }
    .btn { font-size: 16px; padding: 16px 24px; }
    .header .brand { font-size: 18px; }
  }
</style>
</head>
<body>
  <div class="stars"></div>
  <div class="stars2"></div>
  <div class="stars3"></div>

  <div class="header">
    <span class="brand">Vindim</span>
    <img src="logo.ico" alt="logo" onerror="this.style.display='none'">
  </div>

  <div class="center">
    <h1>Добро пожаловать</h1>
    <div class="buttons">
      <a href="choice/" class="btn">📚 Презентации</a>
    </div>
  </div>
</body>
</html>
