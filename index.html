<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Vindim</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: 'Segoe UI', sans-serif;
    background: #0d0620;
    color: #fff;
  }

  /* ===== Звёздный фон ===== */
  .stars, .stars2, .stars3 {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }
  .stars {
    background:
      radial-gradient(2px 2px at 20px 30px, #fff, transparent),
      radial-gradient(2px 2px at 40px 70px, #fff, transparent),
      radial-gradient(1px 1px at 90px 40px, #fff, transparent),
      radial-gradient(1px 1px at 130px 80px, #fff, transparent),
      radial-gradient(2px 2px at 160px 120px, #fff, transparent),
      radial-gradient(1px 1px at 200px 50px, #fff, transparent),
      radial-gradient(1px 1px at 250px 150px, #fff, transparent),
      radial-gradient(2px 2px at 300px 90px, #fff, transparent);
    background-repeat: repeat;
    background-size: 350px 200px;
    animation: twinkle 4s infinite;
  }
  .stars2 {
    background:
      radial-gradient(1px 1px at 50px 20px, #d8b4ff, transparent),
      radial-gradient(1px 1px at 120px 60px, #d8b4ff, transparent),
      radial-gradient(1px 1px at 200px 30px, #d8b4ff, transparent),
      radial-gradient(1px 1px at 280px 100px, #d8b4ff, transparent);
    background-repeat: repeat;
    background-size: 400px 150px;
    animation: twinkle 6s infinite 1s;
  }
  .stars3 {
    background:
      radial-gradient(1px 1px at 30px 40px, #f0abff, transparent),
      radial-gradient(1px 1px at 180px 20px, #f0abff, transparent),
      radial-gradient(2px 2px at 260px 130px, #f0abff, transparent),
      radial-gradient(1px 1px at 380px 90px, #f0abff, transparent);
    background-repeat: repeat;
    background-size: 450px 250px;
    animation: twinkle 8s infinite 2s;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(circle at 30% 40%, rgba(120, 40, 200, 0.35), transparent 60%),
      radial-gradient(circle at 70% 70%, rgba(80, 20, 160, 0.4), transparent 60%),
      linear-gradient(160deg, #1a0733 0%, #0d0620 50%, #1f0a3d 100%);
    z-index: -1;
  }

  /* ===== Шапка ===== */
  .header {
    position: fixed; top: 20px; right: 30px;
    display: flex; align-items: center; gap: 12px;
    z-index: 10; padding: 8px 16px;
    border-radius: 50px;
    background: rgba(60, 20, 120, 0.25);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(180, 130, 255, 0.3);
    box-shadow: 0 4px 20px rgba(120, 40, 200, 0.3);
  }
  .header img {
    width: 40px; height: 40px;
    border-radius: 50%; object-fit: cover;
    border: 2px solid rgba(200, 150, 255, 0.6);
    box-shadow: 0 0 12px rgba(180, 100, 255, 0.6);
  }
  .header .brand {
    font-family: 'Segoe Script', cursive;
    font-size: 26px; color: #e8d5ff;
    text-shadow: 0 0 12px rgba(180, 100, 255, 0.8),
                 0 0 20px rgba(140, 60, 220, 0.5);
    letter-spacing: 1px;
  }

  /* ===== Центр ===== */
  .center {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center; z-index: 5;
  }
  .center h1 {
    font-family: 'Segoe Script', cursive;
    font-size: clamp(36px, 6vw, 72px);
    color: #f3e4ff;
    text-shadow: 0 0 20px rgba(180, 100, 255, 0.9),
                 0 0 40px rgba(140, 60, 220, 0.7),
                 0 0 60px rgba(90, 20, 180, 0.5);
    margin-bottom: 40px; letter-spacing: 2px;
  }

  .btn {
    display: inline-block;
    padding: 18px 44px;
    font-size: 18px; font-weight: 600;
    letter-spacing: 1px; color: #fff;
    text-decoration: none;
    background: linear-gradient(135deg, #7c3aed 0%, #a855f7 50%, #7c3aed 100%);
    background-size: 200% 200%;
    border: 1px solid rgba(220, 180, 255, 0.5);
    border-radius: 50px; cursor: pointer;
    box-shadow:
      0 0 25px rgba(168, 85, 247, 0.7),
      0 0 50px rgba(124, 58, 237, 0.4),
      inset 0 1px 0 rgba(255, 255, 255, 0.3);
    transition: all 0.35s ease;
    animation: pulse 3s ease-in-out infinite;
  }
  .btn:hover {
    transform: translateY(-3px) scale(1.05);
    background-position: 100% 50%;
    box-shadow:
      0 0 40px rgba(200, 120, 255, 0.9),
      0 0 80px rgba(140, 60, 220, 0.6),
      inset 0 1px 0 rgba(255, 255, 255, 0.4);
  }
  .btn:active {
    transform: translateY(-1px) scale(1.02);
  }
  @keyframes pulse {
    0%, 100% {
      box-shadow: 0 0 25px rgba(168, 85, 247, 0.7),
                  0 0 50px rgba(124, 58, 237, 0.4),
                  inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }
    50% {
      box-shadow: 0 0 35px rgba(200, 120, 255, 0.9),
                  0 0 70px rgba(140, 60, 220, 0.6),
                  inset 0 1px 0 rgba(255, 255, 255, 0.4);
    }
  }

  @media (max-width: 600px) {
    .header { top: 12px; right: 12px; padding: 6px 12px; }
    .header .brand { font-size: 20px; }
    .header img { width: 32px; height: 32px; }
    .center h1 { margin-bottom: 28px; }
    .btn { padding: 14px 32px; font-size: 16px; }
  }
</style>
</head>
<body>
  <div class="stars"></div>
  <div class="stars2"></div>
  <div class="stars3"></div>

  <div class="header">
    <span class="brand">Vindim</span>
    <img src="logo.ico" alt="logo" onerror="this.style.display='none'">
  </div>

  <div class="center">
    <h1>Добро пожаловать</h1>
    <a href="https://vadimtychkov17-a11y.github.io/presentation1" class="btn">
      Открыть презентацию
    </a>
  </div>
</body>
</html>
