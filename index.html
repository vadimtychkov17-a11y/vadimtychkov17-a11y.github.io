<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Люблю Галю Бабу ❤️</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    min-height: 100%;
    font-family: 'Segoe Script', 'Brush Script MT', cursive;
    background: #ffffff;
    color: #2a2a2a;
    -webkit-tap-highlight-color: transparent;
  }

  .page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 24px 80px;
    text-align: center;
  }

  /* ===== Заголовок ===== */
  .title {
    font-family: 'Segoe Script', 'Brush Script MT', cursive;
    font-size: clamp(34px, 7vw, 68px);
    font-weight: 700;
    color: #e6397a;
    line-height: 1.2;
    margin-bottom: 40px;
    letter-spacing: 1px;
    animation: softPulse 2.4s ease-in-out infinite;
  }

  .title .heart {
    display: inline-block;
    color: #ff4d6d;
    animation: heartBeat 1.2s ease-in-out infinite;
    transform-origin: center;
  }

  @keyframes softPulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.03); }
  }

  @keyframes heartBeat {
    0%, 100% { transform: scale(1); }
    20%      { transform: scale(1.25); }
    40%      { transform: scale(0.95); }
    60%      { transform: scale(1.15); }
  }

  /* ===== Фото с вращающимися сердечками ===== */
  .photo-wrap {
    position: relative;
    width: min(420px, 82vw);
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 40px;
  }

  .orbit {
    position: absolute;
    inset: 0;
    animation: spin 14s linear infinite;
    pointer-events: none;
  }

  .orbit.reverse {
    inset: -30px;
    animation: spinReverse 22s linear infinite;
  }

  .heart {
    position: absolute;
    font-size: 28px;
    line-height: 1;
    user-select: none;
    filter: drop-shadow(0 2px 4px rgba(230, 57, 122, 0.25));
  }

  /* 6 сердечек по кругу */
  .heart:nth-child(1) { top: 0;    left: 50%; transform: translate(-50%, -50%); }
  .heart:nth-child(2) { top: 25%;  right: 0; transform: translate(50%, -50%); }
  .heart:nth-child(3) { bottom: 25%; right: 0; transform: translate(50%, 50%); }
  .heart:nth-child(4) { bottom: 0; left: 50%; transform: translate(-50%, 50%); }
  .heart:nth-child(5) { bottom: 25%; left: 0; transform: translate(-50%, 50%); }
  .heart:nth-child(6) { top: 25%;  left: 0; transform: translate(-50%, -50%); }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  @keyframes spinReverse {
    from { transform: rotate(360deg); }
    to   { transform: rotate(0deg); }
  }

  /* ===== Само фото ===== */
  .photo {
    position: relative;
    z-index: 2;
    width: 78%;
    height: 78%;
    border-radius: 50%;
    overflow: hidden;
    box-shadow:
      0 10px 40px rgba(230, 57, 122, 0.25),
      0 0 0 6px #ffffff,
      0 0 0 8px rgba(255, 182, 193, 0.55);
    animation: photoFloat 5s ease-in-out infinite;
  }

  .photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  @keyframes photoFloat {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-8px); }
  }

  /* ===== Подпись под фото ===== */
  .caption {
    font-family: 'Segoe Script', 'Brush Script MT', cursive;
    font-size: clamp(20px, 4vw, 32px);
    color: #e6397a;
    letter-spacing: 0.5px;
    opacity: 0.9;
    animation: fadeIn 2s ease 0.3s both;
  }

  .caption .heart {
    display: inline-block;
    color: #ff4d6d;
    animation: heartBeat 1.4s ease-in-out infinite;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 0.9; transform: translateY(0); }
  }

  @media (max-width: 600px) {
    .page { padding: 40px 20px 60px; }
    .title { margin-bottom: 30px; }
    .photo-wrap { margin-bottom: 30px; }
    .heart { font-size: 22px; }
    .orbit.reverse { inset: -20px; }
  }
</style>
</head>
<body>

<div class="page">

  <h1 class="title">
    Люблю Галю Бабу <span class="heart">❤️</span>
  </h1>

  <div class="photo-wrap">

    <!-- Первое кольцо -->
    <div class="orbit">
      <span class="heart">❤️</span>
      <span class="heart">💖</span>
      <span class="heart">💗</span>
      <span class="heart">❤️</span>
      <span class="heart">💕</span>
      <span class="heart">💓</span>
    </div>

    <!-- Второе кольцо — обратное вращение, без 💘 -->
    <div class="orbit reverse">
      <span class="heart">💝</span>
      <span class="heart">❤️</span>
      <span class="heart">💖</span>
      <span class="heart">💗</span>
      <span class="heart">💓</span>
      <span class="heart">💕</span>
    </div>

    <div class="photo">
      <img src="picture.webp" alt="Галя">
    </div>

  </div>

  <p class="caption">
    Галя Баба <span class="heart">❤️</span>
  </p>

</div>

</body>
</html>
