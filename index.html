 <!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Люблю Галю Бабу ❤️</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    min-height: 100%;
    font-family: 'Segoe Script', 'Brush Script MT', cursive;
    background: #ffffff;
    color: #2a2a2a;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }

  .page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 24px 80px;
    text-align: center;
  }

  /* ===== Заголовок ===== */
  .title {
    font-family: 'Segoe Script', 'Brush Script MT', cursive;
    font-size: clamp(34px, 7vw, 68px);
    font-weight: 700;
    color: #e6397a;
    line-height: 1.2;
    margin-bottom: 60px;
    letter-spacing: 1px;
    animation: softPulse 2.4s ease-in-out infinite;
  }

  .title .heart {
    display: inline-block;
    color: #ff4d6d;
    animation: heartBeat 1.2s ease-in-out infinite;
    transform-origin: center;
  }

  @keyframes softPulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.03); }
  }

  @keyframes heartBeat {
    0%, 100% { transform: scale(1); }
    20%      { transform: scale(1.25); }
    40%      { transform: scale(0.95); }
    60%      { transform: scale(1.15); }
  }

  /* ===== Фото с сердечками ===== */
  .photo-wrap {
    position: relative;
    width: min(420px, 82vw);
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 60px;
  }

  .orbit {
    position: absolute;
    inset: -40px;
    animation: spin 18s linear infinite;
    pointer-events: none;
    will-change: transform;
  }

  .orbit.reverse {
    inset: -80px;
    animation: spinReverse 26s linear infinite;
  }

  .orbit .heart {
    position: absolute;
    top: 50%;
    left: 50%;
    font-size: 42px;
    line-height: 1;
    user-select: none;
    animation: thump 1.6s ease-in-out infinite;
    transform-origin: center;
    filter: drop-shadow(0 2px 6px rgba(230, 57, 122, 0.3));
  }

  .orbit.reverse .heart {
    font-size: 34px;
    animation-duration: 2s;
  }

  .orbit .heart:nth-child(1) { transform: translate(-50%, -50%) rotate(0deg)   translateY(-240px) rotate(0deg); }
  .orbit .heart:nth-child(2) { transform: translate(-50%, -50%) rotate(120deg) translateY(-240px) rotate(-120deg); }
  .orbit .heart:nth-child(3) { transform: translate(-50%, -50%) rotate(240deg) translateY(-240px) rotate(-240deg); }

  .orbit.reverse .heart:nth-child(1) { transform: translate(-50%, -50%) rotate(60deg)  translateY(-280px) rotate(-60deg); }
  .orbit.reverse .heart:nth-child(2) { transform: translate(-50%, -50%) rotate(180deg) translateY(-280px) rotate(-180deg); }
  .orbit.reverse .heart:nth-child(3) { transform: translate(-50%, -50%) rotate(300deg) translateY(-280px) rotate(-300deg); }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  @keyframes spinReverse {
    from { transform: rotate(360deg); }
    to   { transform: rotate(0deg); }
  }

  @keyframes thump {
    0%, 100% { scale: 1; }
    15%      { scale: 1.18; }
    30%      { scale: 0.96; }
    45%      { scale: 1.10; }
    60%      { scale: 1; }
  }

  /* ===== Само фото — лёгкое скругление ===== */
  .photo {
    position: relative;
    z-index: 2;
    width: 72%;
    height: 72%;
    border-radius: 8px;   /* ← лёгкое скругление, а не круг */
    overflow: hidden;
    box-shadow:
      0 10px 40px rgba(230, 57, 122, 0.25),
      0 0 0 6px #ffffff,
      0 0 0 8px rgba(255, 182, 193, 0.55);
    animation: photoFloat 5s ease-in-out infinite;
  }

  .photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  @keyframes photoFloat {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-8px); }
  }

  /* ===== Подпись ===== */
  .caption {
    font-family: 'Segoe Script', 'Brush Script MT', cursive;
    font-size: clamp(20px, 4vw, 32px);
    color: #e6397a;
    letter-spacing: 0.5px;
    opacity: 0.9;
    animation: fadeIn 2s ease 0.3s both;
  }

  .caption .heart {
    display: inline-block;
    color: #ff4d6d;
    animation: heartBeat 1.4s ease-in-out infinite;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 0.9; transform: translateY(0); }
  }

  /* ===== Мобильная адаптация ===== */
  @media (max-width: 600px) {
    .page { padding: 40px 20px 60px; }
    .title { margin-bottom: 40px; }
    .photo-wrap {
      margin-bottom: 40px;
      width: min(320px, 78vw);
    }
    .orbit { inset: -30px; }
    .orbit.reverse { inset: -60px; }

    .orbit .heart { font-size: 30px; }
    .orbit.reverse .heart { font-size: 24px; }

    .orbit .heart:nth-child(1) { transform: translate(-50%, -50%) rotate(0deg)   translateY(-180px) rotate(0deg); }
    .orbit .heart:nth-child(2) { transform: translate(-50%, -50%) rotate(120deg) translateY(-180px) rotate(-120deg); }
    .orbit .heart:nth-child(3) { transform: translate(-50%, -50%) rotate(240deg) translateY(-180px) rotate(-240deg); }

    .orbit.reverse .heart:nth-child(1) { transform: translate(-50%, -50%) rotate(60deg)  translateY(-215px) rotate(-60deg); }
    .orbit.reverse .heart:nth-child(2) { transform: translate(-50%, -50%) rotate(180deg) translateY(-215px) rotate(-180deg); }
    .orbit.reverse .heart:nth-child(3) { transform: translate(-50%, -50%) rotate(300deg) translateY(-215px) rotate(-300deg); }

    .photo { border-radius: 18px; }
  }
</style>
</head>
<body>

<div class="page">

  <h1 class="title">
    Люблю Галю Бабу <span class="heart">❤️</span>
  </h1>

  <div class="photo-wrap">

    <div class="orbit">
      <span class="heart">❤️</span>
      <span class="heart">💖</span>
      <span class="heart">💗</span>
    </div>

    <div class="orbit reverse">
      <span class="heart">💕</span>
      <span class="heart">💓</span>
      <span class="heart">💝</span>
    </div>

    <div class="photo">
      <img src="picture.webp" alt="Галя">
    </div>

  </div>

  <p class="caption">
    Галя Баба <span class="heart">❤️</span>
  </p>

</div>

</body>
</html>
