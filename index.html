<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VinMer</title>
<style>
*{box-sizing:border-box} :root{--bg:#e7ebee;--panel:#fff;--text:#222;--muted:#8b96a0;--line:#e5e8eb;--mine:#effdde;--hover:#f2f4f6;--blue:#2aabee}
body{margin:0;height:100vh;overflow:hidden;background:var(--bg);color:var(--text);font:14px Arial,system-ui,sans-serif}.app{height:100vh;display:grid;grid-template-columns:350px 1fr}.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}.top{height:60px;display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line)}.brand{font-weight:800;font-size:20px;color:var(--blue)}.search{flex:1;background:var(--bg);border-radius:20px;padding:9px 13px}.search input{width:100%;border:0;outline:0;background:transparent}.chats{overflow:auto;flex:1}.chat{display:flex;gap:12px;padding:10px 12px;cursor:pointer}.chat:hover,.chat.active{background:var(--hover)}.avatar{width:48px;height:48px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:bold;font-size:18px;flex:none}.info{min-width:0;flex:1;border-bottom:1px solid var(--line);padding-bottom:10px}.row{display:flex;justify-content:space-between;gap:8px}.name{font-weight:700}.time,.preview{color:var(--muted);font-size:12px}.preview{margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.main{min-width:0;display:flex;flex-direction:column;background:var(--bg)}.header{height:60px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:7px 18px;gap:12px}.header .avatar{width:44px;height:44px}.hinfo{flex:1}.hname{font-weight:700}.status{font-size:12px;color:var(--blue);margin-top:3px}.messages{flex:1;overflow:auto;padding:22px 7%;display:flex;flex-direction:column;gap:5px}.day{text-align:center;color:var(--muted);font-size:12px;margin:4px 0 10px}.msg{max-width:min(600px,72%);background:var(--panel);padding:7px 10px 5px;border-radius:12px;align-self:flex-start;box-shadow:0 1px 1px #0001}.msg.mine{align-self:flex-end;background:var(--mine)}.meta{text-align:right;color:var(--muted);font-size:10px;margin-top:3px}.composer{min-height:62px;background:var(--panel);display:flex;align-items:center;gap:8px;padding:9px 14px;border-top:1px solid var(--line)}.composer input{flex:1;border:0;outline:0;background:var(--bg);border-radius:22px;padding:12px 16px}.btn{border:0;background:transparent;color:var(--muted);font-size:22px;cursor:pointer;width:40px;height:40px;border-radius:50%}.send{background:var(--blue);color:#fff}@media(max-width:700px){.app{grid-template-columns:1fr}.side{display:none}.messages{padding:15px 10px}.msg{max-width:85%}}
</style></head>
<body><div class="app"><aside class="side"><div class="top"><div class="brand">VinMer</div><div class="search"><input id="search" placeholder="Поиск"></div></div><div class="chats" id="chats"></div></aside><main class="main"><header class="header"><div class="avatar" id="ha">А</div><div class="hinfo"><div class="hname" id="hn">Антон</div><div class="status" id="hs">в сети</div></div></header><section class="messages" id="messages"></section><form class="composer" id="form"><button class="btn" type="button" id="attach">📎</button><input id="input" autocomplete="off" placeholder="Сообщение"><button class="btn send" type="submit">➤</button></form></main></div>
<script>
const defaults=[{id:"anton",name:"Антон",letter:"А",status:"в сети",messages:[["Привет! 👋",0,"12:41"],["Привет! Как дела?",1,"12:42"],["Нормально. А у тебя?",0,"12:43"]]},{id:"slava",name:"Слава",letter:"С",status:"был недавно",messages:[["Пойдём в Minecraft?",0,"11:18"],["Давай 😎",1,"11:20"]]},{id:"grandma",name:"Бабушка",letter:"Б",status:"была недавно",messages:[["Привет 😊",0,"вчера"],["Привет!",1,"вчера"]]}];
let chats=JSON.parse(localStorage.getItem("vinmer_local")||"null")||defaults,current=localStorage.getItem("vinmer_current")||"anton";const esc=s=>{let d=document.createElement("div");d.textContent=s;return d.innerHTML};function save(){localStorage.setItem("vinmer_local",JSON.stringify(chats));localStorage.setItem("vinmer_current",current)}function list(q=""){let box=document.getElementById("chats");box.innerHTML="";chats.filter(c=>c.name.toLowerCase().includes(q.toLowerCase())).forEach(c=>{let m=c.messages.at(-1),e=document.createElement("div");e.className="chat "+(c.id==current?"active":"");e.innerHTML='<div class="avatar">'+esc(c.letter)+'</div><div class="info"><div class="row"><span class="name">'+esc(c.name)+'</span><span class="time">'+esc(m?.[2]||"")+'</span></div><div class="preview">'+esc(m?.[0]||"Нет сообщений")+'</div></div>';e.onclick=()=>{current=c.id;save();list(document.getElementById("search").value);render()};box.appendChild(e)})}function render(){let c=chats.find(x=>x.id==current)||chats[0];current=c.id;document.getElementById("hn").textContent=c.name;document.getElementById("ha").textContent=c.letter;document.getElementById("hs").textContent=c.status;let box=document.getElementById("messages");box.innerHTML='<div class="day">Сегодня</div>';c.messages.forEach(m=>{let e=document.createElement("div");e.className="msg "+(m[1]?"mine":"");e.innerHTML="<div>"+esc(m[0])+"</div><div class=meta>"+esc(m[2])+(m[1]?" ✓✓":"")+"</div>";box.appendChild(e)});box.scrollTop=box.scrollHeight}document.getElementById("form").onsubmit=e=>{e.preventDefault();let i=document.getElementById("input"),t=i.value.trim();if(!t)return;let c=chats.find(x=>x.id==current),tm=new Date().toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});c.messages.push([t,1,tm]);i.value="";save();list(document.getElementById("search").value);render()};document.getElementById("search").oninput=e=>list(e.target.value);document.getElementById("attach").onclick=()=>{document.getElementById("input").value+="📎 ";document.getElementById("input").focus()};list();render();
</script></body></html>
