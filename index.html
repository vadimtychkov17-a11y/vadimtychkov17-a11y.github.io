<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d0620">
<title>Vindim</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    min-height: 100%;
    overflow-x: hidden;
    font-family: 'Segoe UI', sans-serif;
    background: #0d0620;
    color: #fff;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }

  /* ===== Звёздный фон ===== */
  .stars, .stars2, .stars3 {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }
  .stars {
    background:
      radial-gradient(2px 2px at 20px 30px, #fff, transparent),
      radial-gradient(2px 2px at 40px 70px, #fff, transparent),
      radial-gradient(1px 1px at 90px 40px, #fff, transparent),
      radial-gradient(1px 1px at 130px 80px, #fff, transparent),
      radial-gradient(2px 2px at 160px 120px, #fff, transparent),
      radial-gradient(1px 1px at 200px 50px, #fff, transparent),
      radial-gradient(1px 1px at 250px 150px, #fff, transparent),
      radial-gradient(2px 2px at 300px 90px, #fff, transparent);
    background-repeat: repeat;
    background-size: 350px 200px;
    animation: twinkle 4s infinite;
  }
  .stars2 {
    background:
      radial-gradient(1px 1px at 50px 20px, #d8b4ff, transparent),
      radial-gradient(1px 1px at 120px 60px, #d8b4ff, transparent),
      radial-gradient(1px 1px at 200px 30px, #d8b4ff, transparent),
      radial-gradient(1px 1px at 280px 100px, #d8b4ff, transparent);
    background-repeat: repeat;
    background-size: 400px 150px;
    animation: twinkle 6s infinite 1s;
  }
  .stars3 {
    background:
      radial-gradient(1px 1px at 30px 40px, #f0abff, transparent),
      radial-gradient(1px 1px at 180px 20px, #f0abff, transparent),
      radial-gradient(2px 2px at 260px 130px, #f0abff, transparent),
      radial-gradient(1px 1px at 380px 90px, #f0abff, transparent);
    background-repeat: repeat;
    background-size: 450px 250px;
    animation: twinkle 8s infinite 2s;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.4; }
    50%      { opacity: 1; }
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 30% 40%, rgba(120, 40, 200, 0.35), transparent 60%),
      radial-gradient(circle at 70% 70%, rgba(80, 20, 160, 0.4), transparent 60%),
      linear-gradient(160deg, #1a0733 0%, #0d0620 50%, #1f0a3d 100%);
    z-index: 0;
    pointer-events: none;
  }

  /* ===== Шапка (Vindim + лого справа сверху) ===== */
  .header {
    position: fixed;
    top: 16px;
    right: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 10;
    padding: 8px 16px 8px 14px;
    border-radius: 50px;
    background: rgba(60, 20, 120, 0.35);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(180, 130, 255, 0.35);
    box-shadow: 0 4px 20px rgba(120, 40, 200, 0.35);
  }
  .header img {
    width: clamp(34px, 7vw, 40px);
    height: clamp(34px, 7vw, 40px);
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid rgba(200, 150, 255, 0.6);
    box-shadow: 0 0 12px rgba(180, 100, 255, 0.6);
    flex-shrink: 0;
  }
  .header .brand {
    font-family: 'Segoe Script', 'Brush Script MT', cursive;
    font-size: clamp(20px, 4vw, 26px);
    color: #e8d5ff;
    text-shadow: 0 0 12px rgba(180, 100, 255, 0.8),
                 0 0 20px rgba(140, 60, 220, 0.5);
    letter-spacing: 1px;
    line-height: 1;
  }

  /* ===== Центральный блок ===== */
  .center {
    position: relative;
    z-index: 5;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 110px 24px 60px;
    padding-top: max(110px, calc(env(safe-area-inset-top) + 80px));
    padding-bottom: max(60px, env(safe-area-inset-bottom));
  }

  .center h1 {
    font-family: 'Segoe Script', 'Brush Script MT', cursive;
    font-size: clamp(38px, 8vw, 76px);
    color: #f3e4ff;
    text-shadow:
      0 0 20px rgba(180, 100, 255, 0.9),
      0 0 40px rgba(140, 60, 220, 0.7),
      0 0 60px rgba(90, 20, 180, 0.5);
    margin-bottom: 24px;
    letter-spacing: 2px;
    line-height: 1.15;
    animation: softPulse 3.6s ease-in-out infinite;
  }

  .center .subtitle {
    font-family: 'Segoe Script', 'Brush Script MT', cursive;
    font-size: clamp(20px, 4vw, 30px);
    color: #c9a9ff;
    letter-spacing: 1px;
    margin-bottom: 48px;
    opacity: 0.9;
  }

  @keyframes softPulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.03); }
  }

  /* ===== Кнопки проектов ===== */
  .projects {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    width: 100%;
    max-width: 460px;
  }

  .project-btn {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
    padding: 20px 32px;
    font-family: 'Segoe Script', 'Brush Script MT', cursive;
    font-size: clamp(18px, 4vw, 22px);
    font-weight: 700;
    letter-spacing: 0.8px;
    color: #fff;
    text-decoration: none;
    border-radius: 50px;
    background: linear-gradient(135deg,
      #7c3aed 0%, #a855f7 45%, #c084fc 55%, #a855f7 65%, #7c3aed 100%);
    background-size: 250% 250%;
    background-position: 0% 50%;
    border: 1px solid rgba(220, 180, 255, 0.55);
    box-shadow:
      0 6px 22px rgba(168, 85, 247, 0.6),
      0 0 40px rgba(124, 58, 237, 0.35),
      inset 0 1px 0 rgba(255, 255, 255, 0.4),
      inset 0 -2px 8px rgba(60, 10, 120, 0.5);
    overflow: hidden;
    cursor: pointer;
    min-height: 64px;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1),
                background-position 0.6s ease,
                box-shadow 0.3s ease;
    animation: btnPulse 3s ease-in-out infinite;
  }

  @keyframes btnPulse {
    0%, 100% {
      box-shadow:
        0 6px 22px rgba(168, 85, 247, 0.6),
        0 0 40px rgba(124, 58, 237, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.4),
        inset 0 -2px 8px rgba(60, 10, 120, 0.5);
    }
    50% {
      box-shadow:
        0 8px 30px rgba(200, 120, 255, 0.85),
        0 0 60px rgba(140, 60, 220, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.5),
        inset 0 -2px 8px rgba(60, 10, 120, 0.5);
    }
  }

  .project-btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: -75%;
    width: 50%;
    height: 100%;
    background: linear-gradient(120deg,
      transparent 0%,
      rgba(255, 255, 255, 0.45) 50%,
      transparent 100%);
    transform: skewX(-20deg);
    transition: left 0.7s ease;
    pointer-events: none;
  }

  .project-btn:hover {
    transform: translateY(-3px) scale(1.04);
    background-position: 100% 50%;
    box-shadow:
      0 12px 36px rgba(200, 120, 255, 0.9),
      0 0 70px rgba(160, 80, 255, 0.65),
      inset 0 1px 0 rgba(255, 255, 255, 0.6),
      inset 0 -2px 10px rgba(60, 10, 120, 0.6);
  }
  .project-btn:hover::before {
    left: 125%;
  }
  .project-btn:active {
    transform: translateY(-1px) scale(1.01);
  }

  .project-btn .emoji {
    font-size: 1.2em;
    line-height: 1;
    display: inline-block;
  }
  .project-btn .arrow {
    display: inline-block;
    transition: transform 0.3s ease;
  }
  .project-btn:hover .arrow {
    transform: translateX(4px);
  }

  /* ===== Мобильная адаптация ===== */
  @media (max-width: 600px) {
    .header {
      top: 12px;
      right: 12px;
      padding: 7px 14px 7px 10px;
      gap: 8px;
    }

    .center {
      padding: 90px 20px 40px;
      padding-top: max(90px, calc(env(safe-area-inset-top) + 70px));
      padding-bottom: max(40px, env(safe-area-inset-bottom));
    }

    .center h1 { margin-bottom: 18px; }
    .center .subtitle { margin-bottom: 36px; }

    .project-btn {
      padding: 18px 24px;
      min-height: 60px;
    }
  }

  /* Уважение к "уменьшить движение" */
  @media (prefers-reduced-motion: reduce) {
    .center h1,
    .project-btn,
    .project-btn::before,
    .stars,
    .stars2,
    .stars3 {
      animation: none !important;
      transition: none !important;
    }
  }
</style>
</head>
<body>

<div class="stars"></div>
<div class="stars2"></div>
<div class="stars3"></div>

<!-- Шапка: Vindim + лого -->
<div class="header">
  <span class="brand">Vindim</span>
  <img src="logo.webp" alt="Vindim" onerror="this.style.display='none'">
</div>

<!-- Центр -->
<div class="center">
  <h1>Добро пожаловать</h1>
  <p class="subtitle">Выбери мои проекты</p>

  <div class="projects">
    <a href="https://vadimtychkov17-a11y.github.io/gala" class="project-btn">
      <span class="emoji">❤️</span>
      Люблю Галю Бабу
      <span class="arrow">→</span>
    </a>
  </div>
</div>

</body>
</html>
